<!doctype html>
<!-- taste.html — WALL TASTE terminal: is the muse wall generating well, is it learning EJ's
     taste, what has it learned, what's working. ONE screen, never scrolls; built for half of
     the 4K gaming monitor (≈1280×1440 CSS px at 150%), 3 columns when landscape.
     EJ 2026-10-03: "useless and too scrolly … 50% of my gaming monitor … bloomberg terminal
     vibe", then "use color VERY sparingly" and "starred matters a lot less than stats on the
     generation". So: greyscale; ONE accent, only for the number that matters (★ to activate)
     and stale/broken warnings. Boost vs damp reads from bar direction + fill, not hue.
     Data (preview-server :7861, farm\sd): taste/sys.json (taste-telemetry, 3 s),
     taste/recent.json (30 s), taste/taste-data.json (muse-taste-viz, 6 h),
     taste/events.jsonl (wall clicks), favlist, taste/fav/muse-<id>.png.
     Previous version: farm\sd\taste.html.bak-20261003. Source: ~/.dotfiles/computah/taste.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Taste</title>
<style>
  :root {
    --bg: #000; --panel: #060607; --rule: #1f1f24; --ink: #dcdce0; --hi: #ffffff; --dim: #6f6f78; --faint: #2c2c33;
    --accent: #ff4d8d;                                     /* the ONE accent — use almost never */
    --fs: clamp(10px, min(0.95vw, 0.8vh), 15px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
               font: var(--fs)/1.28 Consolas, Menlo, "DejaVu Sans Mono", monospace; font-variant-numeric: tabular-nums; }
  body { display: grid; gap: 3px; padding: 3px; height: 100vh; grid-template-columns: 1fr 1fr;
         grid-template-rows: auto auto minmax(0, 1.15fr) minmax(0, .7fr) minmax(0, 1.15fr) auto auto;
         grid-template-areas: "top top" "gen out" "style chunk" "src model" "sig wall" "stars stars" "spark spark"; }
  @media (min-aspect-ratio: 4/3) {
    body { grid-template-columns: 1fr 1fr 1fr;
           grid-template-rows: auto auto minmax(0, 1fr) minmax(0, 1fr) auto auto;
           grid-template-areas: "top top top" "gen out out" "style chunk sig" "src model wall" "stars stars stars" "spark spark spark"; }
  }
  .p { background: var(--panel); border: 1px solid var(--rule); min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .h { color: var(--hi); padding: 2px 6px 1px; font-weight: bold; letter-spacing: .06em; border-bottom: 1px solid var(--rule);
       display: flex; justify-content: space-between; white-space: nowrap; }
  .h span { font-weight: normal; color: var(--dim); letter-spacing: 0; }
  .b { padding: 3px 6px; min-height: 0; overflow: hidden; flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 0 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
  td.n { text-align: right; width: 4.6em; max-width: none; color: var(--dim); }
  td.w { text-align: right; width: 3.8em; max-width: none; color: var(--hi); }
  td.bar { width: 32%; max-width: none; }
  .div { position: relative; height: .6em; }
  .div::before { content: ""; position: absolute; left: 50%; top: -1px; bottom: -1px; border-left: 1px solid var(--faint); }
  .div i { position: absolute; top: 0; bottom: 0; }
  .div i.pos { background: #a9a9b0; }                     /* boosted: solid */
  .div i.neg { border: 1px solid #6f6f78; }               /* damped: hollow */
  .lin { position: relative; height: .6em; }
  .lin i { position: absolute; left: 0; top: 0; bottom: 0; background: #a9a9b0; }
  .dim { color: var(--dim); } .hi { color: var(--hi); } .acc { color: var(--accent); }
  .sep td { border-top: 1px solid var(--rule); }
  #top { grid-area: top; display: flex; flex-wrap: wrap; gap: 0 1.5em; align-items: baseline; padding: 4px 8px;
         background: var(--panel); border: 1px solid var(--rule); }
  #top b { color: var(--dim); font-weight: normal; }
  #top .big { font-size: 1.4em; font-weight: bold; color: var(--hi); }
  .gauge { display: inline-block; width: 10em; height: .62em; border: 1px solid var(--faint); vertical-align: middle; position: relative; }
  .gauge i { position: absolute; left: 0; top: 0; bottom: 0; background: #a9a9b0; }
  .kv { display: grid; grid-template-columns: auto 1fr auto; gap: 0 .8em; align-items: center; }
  .kv .k { color: var(--dim); } .kv .v { color: var(--hi); text-align: right; }
  #stars .b { display: flex; gap: 2px; padding: 2px 4px; flex: none; height: 2.8em; overflow: hidden; }
  #stars img { flex: none; width: 2.4em; height: 2.4em; object-fit: cover; display: block; filter: grayscale(.85); opacity: .8; }
  #top .acc { color: var(--accent); }
  #spark svg { display: block; width: 100%; height: 2.8em; }
  .row { display: flex; gap: .6em; white-space: nowrap; overflow: hidden; }
  .row .t { color: var(--dim); flex: none; width: 4.1em; }
</style>
</head>
<body>
<div id="top">…</div>
<div class="p" id="gen" style="grid-area:gen"><div class="h">GENERATION NOW <span id="genage"></span></div><div class="b"></div></div>
<div class="p" id="out" style="grid-area:out"><div class="h">OUTPUT <span>last 100 renders · rate</span></div><div class="b"></div></div>
<div class="p" id="style" style="grid-area:style"><div class="h">STYLE <span>learned odds · seen · ★ mass</span></div><div class="b"></div></div>
<div class="p" id="chunk" style="grid-area:chunk"><div class="h">PALETTE / MOOD <span>learned odds</span></div><div class="b"></div></div>
<div class="p" id="src" style="grid-area:src"><div class="h">WHAT'S WORKING <span>+ reactions / 100 seen</span></div><div class="b"></div></div>
<div class="p" id="model" style="grid-area:model"><div class="h">MODEL + SAMPLER <span>probe · odds</span></div><div class="b"></div></div>
<div class="p" id="sig" style="grid-area:sig"><div class="h">YOUR SIGNAL TAPE <span>newest first</span></div><div class="b"></div></div>
<div class="p" id="wall" style="grid-area:wall"><div class="h">WALL TAPE <span>time · source · style · odds · ej</span></div><div class="b"></div></div>
<div class="p" id="stars" style="grid-area:stars"><div class="h">STARRED <span id="starcount"></span></div><div class="b"></div></div>
<div class="p" id="spark" style="grid-area:spark"><div class="h">THROUGHPUT 24H <span id="sparkmeta"></span></div><div class="b"></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = async (p, kind = 'json') => {
  try { const r = await fetch(`${p}${p.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache: 'no-store' });
        return r.ok ? (kind === 'text' ? r.text() : r.json()) : null; } catch (e) { return null; }
};
const mins = ts => (Date.now() - new Date(ts).getTime()) / 60000;
const ago = ts => { const m = mins(ts);
  return m < 1 ? 'now' : m < 60 ? Math.round(m) + 'm' : m < 1440 ? (m / 60).toFixed(m < 600 ? 1 : 0) + 'h' : Math.round(m / 1440) + 'd'; };
const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
const SRCN = { pure: 'text', screen: 'screen', crop: 'crop', feedback: 'past', game: 'game', taste: 'photo',
               ref: '★ref', bestof: 'best-of', bench: 'chart', studio: 'studio', arena: 'are.na', fuji: 'fuji', cloud: 'cloud' };
let D = null, SYS = null, RECENT = [], W = {}, starsShown = '';

function bar(w) {
  const l = Math.max(-1, Math.min(1, Math.log2(w))), p = Math.abs(l) * 50;
  return `<div class="div"><i class="${l >= 0 ? 'pos' : 'neg'}" style="${l >= 0 ? 'left:50%' : 'right:50%'};width:${p}%"></i></div>`;
}
function lin(frac) { return `<div class="lin"><i style="width:${Math.max(0, Math.min(1, frac)) * 100}%"></i></div>`; }
function fitRows(el) {
  const lh = parseFloat(getComputedStyle(document.body).fontSize) * 1.28;
  return Math.max(3, Math.floor(el.clientHeight / lh) - 1);
}

// ── status line ────────────────────────────────────────────────────────────────
function renderTop() {
  const p = D.probe, need = Math.max(0, Math.ceil(p.min_pos - p.pos_mass));
  const lastH = RECENT.filter(r => mins(r.ts) < 60).length;
  const builtAge = (Date.now() - new Date(D.built.replace(' ', 'T')).getTime()) / 3600e3;
  $('#top').innerHTML =
    `<span class="big">◆ WALL TASTE</span>` +
    `<span><b>STATE</b> <span class="big">${p.ready ? 'MODEL LIVE' : 'LEARNING'}</span></span>` +
    `<span><b>MODEL</b> <span class="gauge"><i style="width:${Math.min(100, 100 * p.pos_mass / p.min_pos)}%"></i></span> ${p.pos_mass.toFixed(1)}/${p.min_pos}</span>` +
    `<span><b>AUC</b> ${p.loo_auc.toFixed(3)} <span class="dim">need ≥${p.min_auc}</span></span>` +
    (p.ready ? `<span>best-of-4 reranking text cells</span>` : `<span><b>TO ACTIVATE</b> <span class="big acc">~${need} ★</span></span>`) +
    `<span><b>WALL</b> <span class="${lastH ? 'hi' : 'acc'}">${lastH}/h</span></span>` +
    `<span><b>REFRESH</b> <span class="${builtAge > 7 ? 'acc' : ''}">${D.built.slice(5)} · ${ago(D.built.replace(' ', 'T'))}</span></span>`;
}

// ── GENERATION NOW (sys.json, 5 s) ──────────────────────────────────────────────
function renderGen() {
  const el = $('#gen .b');
  if (!SYS) { el.innerHTML = '<span class="acc">no telemetry</span>'; return; }
  const sd = SYS.sd || {}, stale = mins(SYS.ts) > 0.5;
  const step = sd.steps ? `${sd.step}/${sd.steps}` : '—';
  const eta = sd.steps && sd.sit ? Math.max(0, (sd.steps - sd.step) * sd.sit).toFixed(0) + 's' : '—';
  const k = (label, val, frac) => `<span class="k">${label}</span>${frac == null ? '<span></span>' : lin(frac)}<span class="v">${val}</span>`;
  el.innerHTML = `<div class="kv">` +
    k('phase', `<span class="${stale ? 'acc' : ''}">${esc(sd.phase || 'idle')}${stale ? ' (stale)' : ''}</span>`) +
    k('step', step, sd.steps ? sd.step / sd.steps : 0) +
    k('s / step', sd.sit != null ? sd.sit.toFixed(2) : '—') +
    k('eta this cell', eta) +
    k('last render', sd.last_s != null ? sd.last_s.toFixed(1) + 's' : '—') +
    k('text encoder (LLM)', SYS.llm ? 'loaded' : 'cold') +
    k('GPU', SYS.gpu + '%', SYS.gpu / 100) +
    k('VRAM', `${SYS.vram_gb.toFixed(1)}/${SYS.vram_total_gb} GB`, SYS.vram_gb / SYS.vram_total_gb) +
    k('CPU', SYS.cpu + '%', SYS.cpu / 100) +
    k('RAM', `${SYS.ram_gb.toFixed(1)}/${SYS.ram_total_gb.toFixed(0)} GB`, SYS.ram_gb / SYS.ram_total_gb) +
    k('side jobs', (SYS.jobs && SYS.jobs.length) ? esc(SYS.jobs.join(', ')) : 'none') +
    k('EJ at the PC', SYS.idle_s < 120 ? 'yes' : `idle ${Math.round(SYS.idle_s / 60)}m`) +
    `</div>`;
  $('#genage').textContent = `telemetry ${hhmm(SYS.ts)}`;
}

// ── OUTPUT: rate + mix of the last 100 renders ─────────────────────────────────
function renderOut() {
  const el = $('#out .b'), last = RECENT.slice(-100);
  const inH = h => RECENT.filter(r => mins(r.ts) < h * 60).length;
  const ts = RECENT.map(r => new Date(r.ts).getTime()).sort((a, b) => a - b);
  const gaps = ts.slice(1).map((t, i) => (t - ts[i]) / 60000).filter(g => g < 60).sort((a, b) => a - b);
  const med = gaps.length ? gaps[Math.floor(gaps.length / 2)] : null;
  const tally = f => { const m = {}; last.forEach(r => { const k = f(r); m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const src = tally(r => SRCN[String(r.src || 'pure').split('+')[0]] || String(r.src).split('+')[0]);
  const smp = tally(r => r.sampler || '?');
  const steps = last.map(r => r.steps).filter(Boolean), ej = last.map(r => r.ej).filter(v => v != null);
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const styles = new Set(last.map(r => String(r.style || '').split(',')[0])).size;
  const mix = (rows) => rows.slice(0, 7).map(([k, v]) => `<span class="hi">${esc(k)}</span> <span class="dim">${pct(v, last.length)}</span>`).join('  ');
  el.innerHTML = `<div class="kv">` +
    `<span class="k">renders 1h · 3h · 24h</span><span></span><span class="v">${inH(1)} · ${inH(3)} · ${inH(24)}</span>` +
    `<span class="k">median gap</span><span></span><span class="v">${med != null ? med.toFixed(1) + ' min' : '—'}</span>` +
    `<span class="k">newest render</span><span></span><span class="v">${RECENT.length ? ago(RECENT[RECENT.length - 1].ts) + ' ago' : '—'}</span>` +
    `<span class="k">steps mean · range</span><span></span><span class="v">${steps.length ? mean(steps).toFixed(1) + ' · ' + Math.min(...steps) + '–' + Math.max(...steps) : '—'}</span>` +
    `<span class="k">distinct styles</span><span></span><span class="v">${styles} / ${last.length}</span>` +
    `<span class="k">ej-taste mean</span><span></span><span class="v">${ej.length ? mean(ej).toFixed(2) : '—'}</span>` +
    `<span class="k">★ · ▼ in these</span><span></span><span class="v">${last.filter(r => r.fav).length} · ${last.filter(r => r.down).length}</span>` +
    `</div>` +
    `<div style="margin-top:4px"><span class="dim">source </span>${mix(src)}</div>` +
    `<div><span class="dim">sampler </span>${mix(smp)}</div>`;
}

// ── learned odds ───────────────────────────────────────────────────────────────
function weightTable(knob, el, nDn) {
  const rows = D.weights.filter(w => w.knob === knob).sort((a, b) => b.w - a.w);
  let nUp = Math.max(4, fitRows(el) - nDn - 3);
  const draw = () => {
    const up = rows.filter(r => r.w > 1.001).slice(0, nUp), dn = rows.filter(r => r.w < 0.999).slice(-nDn);
    const neutral = rows.filter(r => r.w >= 0.999 && r.w <= 1.001).sort((a, b) => b.n - a.n).slice(0, Math.max(0, nUp - up.length));
    const tr = (r, cls) => `<tr><td class="${cls}">${esc(r.key)}</td><td class="bar">${bar(r.w)}</td>` +
      `<td class="w${cls === 'dim' ? ' dim' : ''}">×${r.w.toFixed(2)}</td><td class="n">${r.n}·${r.sig}</td></tr>`;
    el.innerHTML = `<table>${up.map(r => tr(r, '')).join('')}` +
      (neutral.length ? `<tr class="sep"><td colspan="4" class="dim">no evidence yet</td></tr>` + neutral.map(r => tr(r, 'dim')).join('') : '') +
      (dn.length ? `<tr class="sep"><td colspan="4" class="dim">damped</td></tr>` + dn.map(r => tr(r, 'dim')).join('') : '') + `</table>`;
  };
  draw();
  const tr = el.querySelector('tr');
  if (tr && tr.offsetHeight) { const fit = Math.floor(el.clientHeight / tr.offsetHeight) - nDn - 3; if (fit > 0 && fit !== nUp) { nUp = fit; draw(); } }
}
function renderSources() {
  const rows = D.sources.slice().sort((a, b) => b.per100 - a.per100);
  const base = (rows.find(r => r.src === 'pure') || { per100: 0 }).per100, max = Math.max(...rows.map(r => r.per100), 0.01);
  $('#src .b').innerHTML = `<table>` + rows.map(r => {
    const lift = base ? r.per100 / base : 0;
    return `<tr><td class="${r.src === 'pure' ? 'hi' : ''}">${esc(SRCN[r.src] || r.src)}</td><td class="bar">${lin(r.per100 / max)}</td>` +
      `<td class="w">${r.per100.toFixed(2)}</td><td class="n">${r.pos}/${r.seen}</td>` +
      `<td class="n">${r.src === 'pure' ? 'base' : (lift ? '×' + lift.toFixed(1) : '—')}</td></tr>`;
  }).join('') + `</table><div class="dim" style="margin-top:2px">lift vs plain text · small n is noise</div>`;
}
function renderModel() {
  const p = D.probe, sampler = D.weights.filter(w => w.knob === 'sampler').sort((a, b) => b.w - a.w);
  $('#model .b').innerHTML = `<table>` +
    `<tr><td class="dim">preference model</td><td class="w" colspan="2">${p.ready ? 'LIVE' : 'dormant'}</td></tr>` +
    `<tr><td class="dim">positives · mass</td><td class="w" colspan="2">${p.positives} · ${p.pos_mass.toFixed(1)}</td></tr>` +
    `<tr><td class="dim">held-out AUC (0.5 = chance)</td><td class="w" colspan="2">${p.loo_auc.toFixed(3)}</td></tr>` +
    `<tr><td class="dim">labeled (seen) renders</td><td class="w" colspan="2">${p.labeled_renders.toLocaleString()}</td></tr>` +
    `<tr><td class="dim">photo ej-taste metric</td><td class="w" colspan="2">benched · AUC ${D.auc.toFixed(2)}</td></tr>` +
    `<tr><td class="dim">signals ★ ▽ inspect pair</td><td class="w" colspan="2">${D.stars} ${D.events.down} ${D.events.inspect} ${D.events.pair}</td></tr>` +
    `<tr class="sep"><td colspan="3" class="dim">sampler odds</td></tr>` +
    sampler.map(r => `<tr><td>${esc(r.key)}</td><td class="bar">${bar(r.w)}</td><td class="w">×${r.w.toFixed(2)}</td></tr>`).join('') + `</table>`;
}

// ── tapes ──────────────────────────────────────────────────────────────────────
function renderSignals(text) {
  const ev = (text || '').trim().split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(Boolean).reverse();
  const el = $('#sig .b'), n = fitRows(el);
  const G = { inspect: '◇ inspect', down: '▽ not for me', pair: '◆ pair pick', fav: '★ star' };
  el.innerHTML = ev.slice(0, n).map(e => `<div class="row"><span class="t">${hhmm(e.ts)}</span>` +
      `<span class="${e.type === 'inspect' ? 'dim' : 'hi'}" style="flex:none;width:8.5em">${G[e.type] || esc(e.type)}</span>` +
      `<span class="dim">${esc(e.id || '')}${e.win ? ' · won ' + esc(e.win) : ''}</span></div>`).join('') ||
    `<div class="dim">no clicks yet — ★ / ▽ / inspect cells on the IMAGINE wall</div>`;
}
function renderWall() {
  const el = $('#wall .b'), n = fitRows(el);
  el.innerHTML = RECENT.slice().reverse().slice(0, n).map(r => {
    const src = String(r.src || 'pure').split('+')[0], style = String(r.style || '').split(',')[0].trim().toLowerCase();
    const m = (W['style|' + style] || 1) * (W['sampler|' + r.sampler] || 1);
    return `<div class="row"><span class="t">${hhmm(r.ts)}</span><span class="dim" style="width:5.2em;flex:none">${esc(SRCN[src] || src)}</span>` +
      `<span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(style || '—')}</span>` +
      `<span class="${m >= 1 ? 'hi' : 'dim'}" style="flex:none">×${m.toFixed(2)}</span>` +
      `<span class="dim" style="flex:none;width:3.4em;text-align:right">${r.ej == null ? '' : r.ej.toFixed(2)}</span>` +
      `<span class="hi" style="flex:none;width:1em">${r.fav ? '★' : r.down ? '▼' : ''}</span></div>`;
  }).join('');
}
function renderStars(favs) {
  const ids = (favs || D.starred.map(s => s.id)).slice().sort().reverse();
  $('#starcount').textContent = `${ids.length} · newest left`;
  const key = ids.join(',');
  if (key === starsShown) return;
  starsShown = key;
  $('#stars .b').innerHTML = ids.map(id => `<img loading="lazy" title="${esc(id)}" src="taste/fav/muse-${encodeURIComponent(id)}.png">`).join('');
}
function renderSpark() {
  const el = $('#spark .b'), now = Date.now(), H = 24, bins = Array(H).fill(0), favs = Array(H).fill(0);
  RECENT.forEach(r => { const h = Math.floor((now - new Date(r.ts).getTime()) / 3600e3); if (h >= 0 && h < H) { bins[H - 1 - h]++; if (r.fav) favs[H - 1 - h]++; } });
  const max = Math.max(1, ...bins), w = 100 / H;
  el.innerHTML = `<svg viewBox="0 0 100 30" preserveAspectRatio="none">` +
    bins.map((b, i) => `<rect x="${i * w + .15}" y="${30 - 27 * b / max}" width="${w - .3}" height="${Math.max(.6, 27 * b / max)}" fill="${b ? '#a9a9b0' : '#1f1f24'}"/>` +
      (favs[i] ? `<rect x="${i * w + .15}" y="0" width="${w - .3}" height="1.5" fill="#ffffff"/>` : '')).join('') + `</svg>`;
  $('#sparkmeta').textContent = `renders/hour, newest right · peak ${max}/h · white tick = ★ that hour`;
}

async function slow() {
  const [d, rec, ev, favs] = await Promise.all([get('taste/taste-data.json'), get('taste/recent.json'),
                                               get('taste/events.jsonl', 'text'), get('favlist')]);
  if (d) { D = d; W = {}; D.weights.forEach(w => W[w.knob + '|' + w.key] = w.w); }
  if (rec) RECENT = rec.renders || [];
  if (!D) { $('#top').textContent = 'waiting for taste-data.json …'; return; }
  renderTop(); renderOut();
  weightTable('style', $('#style .b'), 5); weightTable('chunk', $('#chunk .b'), 5);
  renderSources(); renderModel(); renderSignals(ev); renderWall(); renderStars(favs && favs.ids); renderSpark();
}
async function fast() { const s = await get('taste/sys.json'); if (s) SYS = s; renderGen(); }
slow(); fast(); setInterval(slow, 30000); setInterval(fast, 5000);
addEventListener('resize', () => { if (D) slow(); fast(); });
</script>
</body>
</html>
