<!doctype html>
<!-- taste.html — WALL TASTE terminal. Is the muse wall learning EJ's taste, what has it
     learned, what's working, what moves it forward. ONE screen, never scrolls; built for
     half of the 4K gaming monitor (≈1280×1440 CSS px at 150%), adapts to landscape halves.
     EJ 2026-10-03: "useless and too scrolly … comfortable being 50% of my gaming monitor and a
     hyper-dense dashboard bloomberg terminal vibe".
     Data (preview-server :7861, farm\sd): taste/taste-data.json (muse-taste-viz, every 6 h),
     taste/recent.json (taste-telemetry, 30 s), taste/events.jsonl (wall clicks), favlist,
     taste/fav/muse-<id>.png. Previous version: farm\sd\taste.html.bak-20261003.
     Source of truth: ~/.dotfiles/computah/taste.html (ASCII-safe JS, no external deps). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Taste</title>
<style>
  :root {
    --bg: #000; --panel: #07070a; --rule: #1d1d24; --ink: #e4e4ea; --dim: #73737f; --faint: #3a3a44;
    --amber: #ffb000; --hot: #ff4d8d; --cool: #7bf0f9; --ok: #7dff9a;
    --fs: clamp(10px, min(0.95vw, 0.82vh), 15px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
               font: var(--fs)/1.28 Consolas, Menlo, "DejaVu Sans Mono", monospace; font-variant-numeric: tabular-nums; }
  body { display: grid; gap: 3px; padding: 3px; height: 100vh;
         grid-template-columns: 1fr 1fr;
         grid-template-rows: auto minmax(0, 1.25fr) minmax(0, .72fr) auto minmax(0, 1.25fr) auto;
         grid-template-areas: "top top" "style chunk" "src model" "stars stars" "sig wall" "spark spark"; }
  @media (min-aspect-ratio: 4/3) {           /* landscape half: three columns */
    body { grid-template-columns: 1fr 1fr 1fr;
           grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) auto auto;
           grid-template-areas: "top top top" "style chunk sig" "src model wall" "stars stars stars" "spark spark spark"; }
  }
  .p { background: var(--panel); border: 1px solid var(--rule); min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .h { background: var(--amber); color: #000; padding: 1px 6px; font-weight: bold; letter-spacing: .04em;
       display: flex; justify-content: space-between; white-space: nowrap; }
  .h span { font-weight: normal; }
  .b { padding: 3px 6px; min-height: 0; overflow: hidden; flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 0 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
  td.n { text-align: right; width: 4.6em; max-width: none; color: var(--dim); }
  td.w { text-align: right; width: 3.6em; max-width: none; }
  td.bar { width: 34%; max-width: none; }
  .div { position: relative; height: .62em; }
  .div::before { content: ""; position: absolute; left: 50%; top: -1px; bottom: -1px; border-left: 1px solid var(--faint); }
  .div i { position: absolute; top: 0; bottom: 0; }
  .up { color: var(--hot); } .dn { color: var(--cool); } .dim { color: var(--dim); } .am { color: var(--amber); } .ok { color: var(--ok); }
  .sep td { border-top: 1px solid var(--rule); padding-top: 1px; }
  #top { grid-area: top; display: flex; flex-wrap: wrap; gap: 0 1.6em; align-items: baseline; padding: 4px 8px;
         background: var(--panel); border: 1px solid var(--rule); }
  #top b { color: var(--amber); font-weight: normal; }
  #top .big { font-size: 1.45em; font-weight: bold; }
  .gauge { display: inline-block; width: 11em; height: .7em; border: 1px solid var(--faint); vertical-align: middle; position: relative; }
  .gauge i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--hot); }
  .gauge s { position: absolute; top: -2px; bottom: -2px; border-left: 1px solid var(--ink); }
  #stars .b { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(6.5em, 12%), 1fr)); gap: 3px; padding: 3px; }
  #stars img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #111; }
  #spark svg { display: block; width: 100%; height: 3.4em; }
  .row { display: flex; gap: .6em; white-space: nowrap; overflow: hidden; }
  .row .t { color: var(--dim); flex: none; width: 4.1em; }
  .stale { color: var(--hot); }
</style>
</head>
<body>
<div id="top">…</div>
<div class="p" id="style" style="grid-area:style"><div class="h">STYLE <span>learned odds · seen · ★ mass</span></div><div class="b"></div></div>
<div class="p" id="chunk" style="grid-area:chunk"><div class="h">PALETTE / MOOD <span>learned odds</span></div><div class="b"></div></div>
<div class="p" id="src" style="grid-area:src"><div class="h">WHAT'S WORKING <span>+ reactions per 100 seen</span></div><div class="b"></div></div>
<div class="p" id="model" style="grid-area:model"><div class="h">MODEL + SAMPLER <span>probe · odds</span></div><div class="b"></div></div>
<div class="p" id="stars" style="grid-area:stars"><div class="h">STARRED <span id="starcount"></span></div><div class="b"></div></div>
<div class="p" id="sig" style="grid-area:sig"><div class="h">YOUR SIGNAL TAPE <span>newest first</span></div><div class="b"></div></div>
<div class="p" id="wall" style="grid-area:wall"><div class="h">WALL TAPE <span>source · style · odds · ej</span></div><div class="b"></div></div>
<div class="p" id="spark" style="grid-area:spark"><div class="h">THROUGHPUT 24H <span id="sparkmeta"></span></div><div class="b"></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = async (p, kind = 'json') => {
  try { const r = await fetch(`${p}${p.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache: 'no-store' });
        return r.ok ? (kind === 'text' ? r.text() : r.json()) : null; } catch (e) { return null; }
};
const ago = ts => { const m = (Date.now() - new Date(ts).getTime()) / 60000;
  return m < 1 ? 'now' : m < 60 ? Math.round(m) + 'm' : m < 1440 ? (m / 60).toFixed(m < 600 ? 1 : 0) + 'h' : Math.round(m / 1440) + 'd'; };
const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const SRCN = { pure: 'text', screen: 'screen', crop: 'crop', feedback: 'past', game: 'game', taste: 'photo',
               ref: '★ref', bestof: 'best-of', bench: 'chart', studio: 'studio', arena: 'are.na', fuji: 'fuji', cloud: 'cloud' };
let D = null, RECENT = [], W = {}, starsShown = '';

function bar(w) {            // diverging bar on log2 scale, clamp 0.5x..2x
  const l = Math.max(-1, Math.min(1, Math.log2(w)));
  const pct = Math.abs(l) * 50;
  return `<div class="div"><i style="${l >= 0 ? 'left:50%' : 'right:50%'};width:${pct}%;background:${l >= 0 ? 'var(--hot)' : 'var(--cool)'}"></i></div>`;
}
function weightTable(knob, el, nUp, nDn, again = true) {
  const rows = D.weights.filter(w => w.knob === knob).sort((a, b) => b.w - a.w);
  const draw = () => weightTableDraw(knob, el, rows, nUp, nDn);
  draw();
  if (!again) return;
  const tr = el.querySelector('tr');                       // measure a REAL row, then fill the panel
  if (tr && tr.offsetHeight) {
    const fit = Math.floor(el.clientHeight / tr.offsetHeight) - nDn - 3;
    if (fit > 0 && fit !== nUp) { nUp = fit; draw(); }
  }
}
function weightTableDraw(knob, el, rows, nUp, nDn) {
  const up = rows.filter(r => r.w > 1.001).slice(0, nUp), dn = rows.filter(r => r.w < 0.999).slice(-nDn);
  // spare rows (fewer boosted entries than space) → the UNTESTED ones, dim: what his picks haven't touched
  const neutral = rows.filter(r => r.w >= 0.999 && r.w <= 1.001).sort((a, b) => b.n - a.n).slice(0, Math.max(0, nUp - up.length));
  const tr = (r, cls) => `<tr><td class="${cls}">${esc(r.key)}</td><td class="bar">${bar(r.w)}</td>` +
    `<td class="w ${cls}">×${r.w.toFixed(2)}</td><td class="n">${r.n}·${r.sig}</td></tr>`;
  el.innerHTML = `<table>${up.map(r => tr(r, 'up')).join('')}` +
    (neutral.length ? `<tr class="sep"><td colspan="4" class="dim">no evidence yet (×1.00, untouched by your picks)</td></tr>` + neutral.map(r => tr(r, 'dim')).join('') : '') +
    (dn.length ? `<tr class="sep"><td colspan="4"></td></tr>` + dn.map(r => tr(r, 'dn')).join('') : '') + `</table>` +
    `<div class="dim" style="margin-top:2px">${rows.length} ${knob === 'chunk' ? 'palettes' : knob + 's'} weighted · bars: log scale ×0.5 … ×2</div>`;
}
function fitRows(el) {       // how many table rows fit the panel body (no scrolling, ever)
  const lh = parseFloat(getComputedStyle(document.body).fontSize) * 1.28;
  return Math.max(3, Math.floor(el.clientHeight / lh) - 2);
}

function renderTop() {
  const p = D.probe, mass = p.pos_mass, need = Math.max(0, Math.ceil(p.min_pos - mass));
  const pct = Math.min(100, 100 * mass / p.min_pos);
  const ready = p.ready, aucOk = p.loo_auc >= p.min_auc;
  const lastH = RECENT.filter(r => Date.now() - new Date(r.ts).getTime() < 3600e3).length;
  const builtAge = (Date.now() - new Date(D.built.replace(' ', 'T')).getTime()) / 3600e3;
  $('#top').innerHTML =
    `<span class="big am">◆ WALL TASTE</span>` +
    `<span><b>STATE</b> <span class="big ${ready ? 'ok' : 'up'}">${ready ? 'MODEL LIVE' : 'LEARNING'}</span></span>` +
    `<span><b>MODEL</b> <span class="gauge"><i style="width:${pct}%"></i></span> ${mass.toFixed(1)}/${p.min_pos} ★-mass</span>` +
    `<span><b>AUC</b> <span class="${aucOk ? 'ok' : 'dn'}">${p.loo_auc.toFixed(3)}</span> <span class="dim">need ≥${p.min_auc}</span></span>` +
    (ready ? `<span class="ok">best-of-4 reranking 25% of text cells</span>`
           : `<span><b>TO ACTIVATE</b> <span class="big up">~${need} ★</span></span>`) +
    `<span><b>SEEN</b> ${D.seen.toLocaleString()} <span class="dim">renders / ${D.seen_hours}h</span></span>` +
    `<span><b>★/SEEN-H</b> ${D.stars_per_seen_hour.toFixed(3)}</span>` +
    `<span><b>WALL</b> <span class="${lastH ? '' : 'stale'}">${lastH}/h</span></span>` +
    `<span><b>REFRESH</b> <span class="${builtAge > 7 ? 'stale' : ''}">${D.built.slice(5)} (${ago(D.built.replace(' ', 'T'))})</span> <span class="dim">every 6h</span></span>`;
}
function renderSources() {
  const rows = D.sources.slice().sort((a, b) => b.per100 - a.per100);
  const base = (rows.find(r => r.src === 'pure') || { per100: 0 }).per100;
  const max = Math.max(...rows.map(r => r.per100), 0.01);
  $('#src .b').innerHTML = `<table>` + rows.map(r => {
    const lift = base ? r.per100 / base : 0, cls = r.src === 'pure' ? '' : lift > 1.2 ? 'up' : lift < 0.8 ? 'dn' : '';
    return `<tr><td class="${cls}">${esc(SRCN[r.src] || r.src)}</td>` +
      `<td class="bar"><div class="div" style="--x:0"><i style="left:0;width:${100 * r.per100 / max}%;background:${cls === 'dn' ? 'var(--cool)' : 'var(--hot)'}"></i></div></td>` +
      `<td class="w">${r.per100.toFixed(2)}</td><td class="n">${r.pos}/${r.seen}</td>` +
      `<td class="n ${cls}">${r.src === 'pure' ? 'base' : (lift ? '×' + lift.toFixed(1) : '—')}</td></tr>`;
  }).join('') + `</table><div class="dim" style="margin-top:2px">vs plain text (base). small n = noisy: ★ref ${(rows.find(r => r.src === 'ref') || {}).seen || 0} seen</div>`;
}
function renderModel() {
  const p = D.probe, el = $('#model .b');
  const sampler = D.weights.filter(w => w.knob === 'sampler').sort((a, b) => b.w - a.w);
  el.innerHTML =
    `<table>` +
    `<tr><td>preference model</td><td class="w" colspan="2">${p.ready ? '<span class="ok">LIVE</span>' : '<span class="up">dormant</span>'}</td></tr>` +
    `<tr><td>positives (seen ★ + ½ inspect/pair)</td><td class="w" colspan="2">${p.positives} · ${p.pos_mass.toFixed(1)}</td></tr>` +
    `<tr><td>held-out AUC (0.5 = chance)</td><td class="w" colspan="2">${p.loo_auc.toFixed(3)}</td></tr>` +
    `<tr><td>labeled renders</td><td class="w" colspan="2">${p.labeled_renders.toLocaleString()}</td></tr>` +
    `<tr><td>photo ej-taste metric</td><td class="w dn" colspan="2">benched · AUC ${D.auc.toFixed(2)}</td></tr>` +
    `<tr><td>signals</td><td class="w" colspan="2">★${D.stars} ▽${D.events.down} insp ${D.events.inspect} pair ${D.events.pair}</td></tr>` +
    `<tr class="sep"><td colspan="3"></td></tr>` +
    sampler.map(r => `<tr><td class="${r.w > 1 ? 'up' : 'dn'}">${esc(r.key)}</td><td class="bar">${bar(r.w)}</td><td class="w ${r.w > 1 ? 'up' : 'dn'}">×${r.w.toFixed(2)}</td></tr>`).join('') +
    `</table>`;
}
function renderStars(favs) {
  const ids = (favs || D.starred.map(s => s.id)).slice().sort().reverse();
  $('#starcount').textContent = `${ids.length} · newest first · the model trains on these`;
  const key = ids.join(',');
  if (key === starsShown) return;              // images load once; no re-fetch every poll
  starsShown = key;
  $('#stars .b').innerHTML = ids.map(id => `<img loading="lazy" title="${esc(id)}" src="taste/fav/muse-${encodeURIComponent(id)}.png">`).join('');
}
function renderSignals(text) {
  const ev = (text || '').trim().split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(Boolean).reverse();
  const el = $('#sig .b'), n = fitRows(el);
  const G = { inspect: ['◇', 'dim', 'inspect'], down: ['▽', 'dn', 'not for me'], pair: ['◆', 'am', 'pair pick'], fav: ['★', 'up', 'star'] };
  el.innerHTML = ev.slice(0, n).map(e => { const g = G[e.type] || ['○', 'dim', e.type];
    return `<div class="row"><span class="t">${hhmm(e.ts)}</span><span class="${g[1]}">${g[0]} ${g[2]}</span><span class="dim">${esc(e.id || '')}</span>` +
           (e.win ? `<span class="am">win ${esc(e.win)}</span>` : '') + `</div>`; }).join('') ||
    `<div class="dim">no clicks logged yet — ★ / ▽ / inspect cells on the IMAGINE wall</div>`;
}
function renderWall() {
  const el = $('#wall .b'), n = fitRows(el);
  el.innerHTML = RECENT.slice().reverse().slice(0, n).map(r => {
    const src = String(r.src || 'pure').split('+')[0], style = String(r.style || '').split(',')[0].trim().toLowerCase();
    const m = (W['style|' + style] || 1) * (W['sampler|' + r.sampler] || 1);
    return `<div class="row"><span class="t">${hhmm(r.ts)}</span><span class="${src === 'ref' || src === 'bestof' ? 'am' : 'dim'}" style="width:5.2em;flex:none">${esc(SRCN[src] || src)}</span>` +
      `<span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(style || '—')}</span>` +
      `<span class="${m > 1.05 ? 'up' : m < 0.95 ? 'dn' : 'dim'}" style="flex:none">×${m.toFixed(2)}</span>` +
      `<span class="dim" style="flex:none;width:3.4em;text-align:right">${r.ej == null ? '' : r.ej.toFixed(2)}</span>` +
      `<span style="flex:none;width:1em">${r.fav ? '<span class="up">★</span>' : r.down ? '<span class="dn">▼</span>' : ''}</span></div>`;
  }).join('');
}
function renderSpark() {
  const el = $('#spark .b'), now = Date.now(), H = 24, bins = Array(H).fill(0), favs = Array(H).fill(0);
  RECENT.forEach(r => { const h = Math.floor((now - new Date(r.ts).getTime()) / 3600e3); if (h >= 0 && h < H) { bins[H - 1 - h]++; if (r.fav) favs[H - 1 - h]++; } });
  const max = Math.max(1, ...bins), w = 100 / H;
  el.innerHTML = `<svg viewBox="0 0 100 30" preserveAspectRatio="none">` +
    bins.map((b, i) => `<rect x="${i * w + .15}" y="${30 - 26 * b / max}" width="${w - .3}" height="${26 * b / max}" fill="${b ? '#ff4d8d' : '#1d1d24'}" opacity="${b ? .85 : 1}"/>` +
      (favs[i] ? `<rect x="${i * w + .15}" y="0" width="${w - .3}" height="2" fill="#ffb000"/>` : '')).join('') + `</svg>`;
  $('#sparkmeta').textContent = `renders/hour, last 24h (newest right) · peak ${max}/h · gaps = PC off, paused for games, or broken · amber = ★ that hour`;
}

async function tick() {
  const [d, rec, ev, favs] = await Promise.all([get('taste/taste-data.json'), get('taste/recent.json'),
                                               get('taste/events.jsonl', 'text'), get('favlist')]);
  if (d) { D = d; W = {}; D.weights.forEach(w => W[w.knob + '|' + w.key] = w.w); }
  if (rec) RECENT = rec.renders || [];
  if (!D) { $('#top').textContent = 'waiting for taste-data.json …'; return; }
  renderTop();
  weightTable('style', $('#style .b'), Math.max(4, fitRows($('#style .b')) - 6), 5);
  weightTable('chunk', $('#chunk .b'), Math.max(4, fitRows($('#chunk .b')) - 6), 5);
  renderSources(); renderModel(); renderStars(favs && favs.ids); renderSignals(ev); renderWall(); renderSpark();
}
tick(); setInterval(tick, 30000);
addEventListener('resize', () => D && tick());
</script>
</body>
</html>
