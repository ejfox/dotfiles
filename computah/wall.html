<!doctype html>
<html class="kit" style="background:#000">
<head><meta charset="utf-8"><title>IMAGINE wall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- shared palette + helpers for all computah screens (kit.css RULES = the color brief):
     greyscale unless the hue encodes data — --fam-text / --fam-seeded / --fam-taste = source
     family, --warn = stale/broken only. ★ = --hi, ▼ = ink on cells / --dim in text. -->
<link rel="stylesheet" href="kit.css">
<style>
  #wall > div { position: relative; overflow: hidden; background: var(--panel); cursor: pointer; }
  #wall > div:hover { outline: 1px solid var(--dim); outline-offset: -1px; }
  /* glyphs sit on arbitrary pixels: a 1px black halo is the minimum that keeps them legible */
  .star, .srcbadge, .down { position: absolute; top: 3px; pointer-events: none; text-shadow: 0 0 1px #000, 0 0 2px #000; line-height: 1; }
  .star { right: 5px; font-size: 16px; color: var(--hi); }
  .srcbadge { left: 6px; font-size: 14px; display: none; }      /* color = source family, set in JS */
  #wall > div:hover .srcbadge.on { display: block; }
  /* buttons = kit .kbtn (flat, em-padded, font inherited); containers set the 12px size */
  #ctl, #pairbar, #ovmeta .btns { font-size: 12px; }
  #ctl { position: fixed; top: 7px; left: 9px; z-index: 6; display: flex; gap: 6px; align-items: center; opacity: .45; transition: opacity .2s; background: var(--bg); padding: 3px 6px; }
  #ctl:hover { opacity: 1; }
  #ctl .sep { width: 1px; align-self: stretch; background: var(--faint); margin: 0 2px; }
  #ctl .lbl { color: var(--dim); font-size: 11px; }
  #ctl .kbtn.mode.on { color: var(--hi); border-color: var(--dim); }
  .down { right: 6px; font-size: 14px; color: var(--ink); }
  /* daily pair pick: two cells outlined, one click = which one EJ prefers */
  #wall > div.pairpick { outline: 2px dashed var(--hi) !important; outline-offset: -2px; }
  /* DENSE MODE (2026-09-30): caption strip + source edge tick per cell, 2h timeline */
  /* captions scale with the CELL (container queries), not the window: an 8x8 grid
     on a laptop and a 3x3 on a 4K panel both read right. */
  #wall > div { container-type: size; }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: .25em .5em .3em .8em; background: rgba(0,0,0,.72);
         font: clamp(9px, 4.2cqw, 20px)/1.3 var(--mono); color: var(--ink); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap b { color: var(--hi); font-weight: 600; } .cap .m { color: var(--dim); }
  .cap .fav { color: var(--hi); } .cap .dn { color: var(--dim); }
  .cap .l1, .cap .l2 { display: block; overflow: hidden; text-overflow: ellipsis; }
  .star { font-size: clamp(12px, 7cqw, 30px) !important; } .down { font-size: clamp(11px, 6cqw, 26px) !important; }
  .tick { width: clamp(2px, 1.1cqw, 6px) !important; }
  /* EJ 2026-09-30: small cells = images only (no caption, no tick); big cells get both lines */
  @container (max-width: 199px), (max-height: 150px) { .cap, .tick { display: none !important; } }
  .tick { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; pointer-events: none; }
  /* 2h render timeline strip — one wall, no modes (EJ 2026-09-30) */
  #tl { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: var(--tlh); background: var(--bg); border-top: 1px solid var(--rule); z-index: 5; }
  :root { --tlh: clamp(24px, 2.6vh, 48px); }
  #wall { height: calc(100vh - var(--tlh)) !important; }
  @media (max-width: 520px) { #tl { display: none; } #wall { height: 100vh !important; } }
  @media (max-width: 520px) { #ctl { flex-wrap: wrap; max-width: calc(100vw - 22px); } #ctl { font-size: 11px; } }
  #pairbar { position: fixed; top: 7px; left: 50%; transform: translateX(-50%); z-index: 7; display: none; gap: 10px; align-items: center;
             background: var(--bg); border: 1px solid var(--faint); padding: 5px 10px; color: var(--ink); font-size: 12px; }
  /* inspect overlay */
  #ov { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; z-index: 10; align-items: center; justify-content: center; cursor: zoom-out; }
  #card { display: flex; gap: 22px; max-width: 1120px; width: 92vw; max-height: 88vh; padding: 20px; box-sizing: border-box; background: var(--bg); border: 1px solid var(--rule); cursor: auto; }
  #ovimg { width: 44%; object-fit: contain; background: var(--bg); align-self: flex-start; }
  #ovmeta { flex: 1; overflow: auto; color: var(--ink); font-size: 14px; line-height: 1.5; }
  #ovmeta .title { color: var(--hi); font-size: 21px; line-height: 1.35; flex: 1; }
  #ovmeta .irow { display: grid; grid-template-columns: 11em 1fr; gap: 0 .8em; margin: 2px 0; }
  #ovmeta .irow .k { color: var(--dim); }
  #ovmeta .sec { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--rule); color: var(--dim); font-size: 12px; }
  #ovmeta .seedimg { display: block; margin-top: 6px; max-width: 240px; max-height: 170px; border: 1px solid var(--rule); background: var(--bg); }
  #ovmeta .prompt { color: var(--ink); font-size: 12px; line-height: 1.5; margin-top: 5px; }
  #ovmeta .kbtn { white-space: nowrap; text-align: left; }
  #ovmeta .kbtn.on { color: var(--hi); border-color: var(--dim); }
  @media (max-width: 700px) { #card { flex-direction: column; overflow: auto; } #ovimg { width: 100%; } }
</style>
</head>
<body style="margin:0;overflow:hidden">
<div id="wall" style="display:grid;gap:2px;width:100vw;height:100vh;padding:2px;box-sizing:border-box"></div>

<!-- top-left controls (fade in on hover so they don't clutter the ambient wall) -->
<div id="ctl">
  <span class="lbl">grid</span>
  <button class="kbtn" onclick="stepN(-1)">−</button>
  <span id="nlabel" style="color:var(--ink);min-width:50px;text-align:center"></span>
  <button class="kbtn" onclick="stepN(1)">+</button>
  <button class="kbtn" id="fitbtn" onclick="toggleFit()"></button>
  <!-- source toggle (EJ 2026-10-04): shared via the server, so every screen + the generator follow -->
  <span class="sep"></span>
  <span class="lbl">show</span>
  <button class="kbtn mode" data-m="flux" onclick="setMode('flux')" title="key 1">○ flux</button>
  <button class="kbtn mode" data-m="mix" onclick="setMode('mix')" title="key 2">◇ both</button>
  <button class="kbtn mode" data-m="blender" onclick="setMode('blender')" title="key 3">■ blender</button>
  <!-- folder buttons live here too (were bottom-right, where they covered a caption) -->
  <span class="sep"></span>
  <button class="kbtn" onclick="openFolder('gallery')">◆ all renders</button>
  <button class="kbtn" onclick="openFolder('favorites')">★ favorites</button>
</div>
<svg id="tl" aria-label="last 2 hours of renders"></svg>

<!-- daily pair pick prompt -->
<div id="pairbar"><span class="hi">◆</span> which of the two outlined cells do you like more? <button class="kbtn" onclick="endPair(true)">skip today</button></div>

<!-- click-to-inspect overlay -->
<div id="ov">
  <div id="card">
    <img id="ovimg">
    <div id="ovmeta"></div>
  </div>
</div>

<script src="kit.js"></script>
<script>
const wall = document.getElementById('wall');
const clampN = n => Math.max(2, Math.min(8, n || 4));
// user's UI choice (localStorage) wins; else the ?n= the wall was opened with; else 4
let N = clampN(parseInt(localStorage.getItem('wallN') || new URLSearchParams(location.search).get('n') || '4'));
// ?view=1 = read-only viewer: never steers the generator's grid size (any extra
// screen looking at the wall used to resize the real wall).
const VIEW_ONLY = new URLSearchParams(location.search).get('view') === '1';
const reportN = n => { if (VIEW_ONLY) return; try { fetch('setn?n=' + n, { cache: 'no-store' }); } catch (e) {} };
reportN(N);
let fitMode = localStorage.getItem('wallFit') || 'cover';   // cover = fill/crop, contain = fit/letterbox (true aspect)
let favset = new Set(), downset = new Set();
let WMAP = {};                                           // learned weights: 'knob|key' -> multiplier
// source family / glyphs / names / escaping all come from the shared kit (kit.js)
const { FAMILY, FCOL, FHEX, FGLYPH, esc } = KIT;
// SVG presentation attributes can't take var(): read the kit's greys once
const { cssvar, agoText } = KIT;
const C = { hi: cssvar('--hi') || '#fff', dim: cssvar('--dim') || '#6f6f78', rule: cssvar('--rule') || '#1f1f24', warn: cssvar('--warn') || '#ffb000', mono: cssvar('--mono') || 'monospace' };
let pair = null;   // [i, j] while today's pair pick is showing

let total, divs, cells, stars, srcs, downs, caps, ticks, cellIds, traceCache, live = 0;
// taste signals → preview-server /event → taste\events.jsonl (learned from on the Mac)
const sendEvent = qs => { try { fetch('event?' + qs + '&t=' + Date.now(), { cache: 'no-store' }); } catch (e) {} };

function buildGrid() {
  total = N * N; live = 0;
  wall.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  wall.style.gridTemplateRows = `repeat(${N}, 1fr)`;
  wall.innerHTML = '';
  divs = []; cells = []; stars = []; srcs = []; downs = []; caps = []; ticks = []; cellIds = []; traceCache = []; pair = null;
  const pb = document.getElementById('pairbar'); if (pb) pb.style.display = 'none';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    const img = document.createElement('img');
    img.style.cssText = `width:100%;height:100%;object-fit:${fitMode};display:block`;
    const st = document.createElement('span'); st.className = 'star'; st.textContent = '★'; st.style.display = 'none';
    const sc = document.createElement('span'); sc.className = 'srcbadge'; sc.textContent = '◇'; sc.title = 'img2img — had a source image (click to see it)';
    const dn = document.createElement('span'); dn.className = 'down'; dn.textContent = '▼'; dn.style.display = 'none';
    const cp = document.createElement('div'); cp.className = 'cap';
    const tk = document.createElement('div'); tk.className = 'tick';
    d.appendChild(img); d.appendChild(st); d.appendChild(sc); d.appendChild(dn); d.appendChild(cp); d.appendChild(tk);
    d.addEventListener('click', () => (pair && pair.includes(i)) ? pickPair(i) : inspect(i));
    wall.appendChild(d);
    divs.push(d); cells.push(img); stars.push(st); srcs.push(sc); downs.push(dn); caps.push(cp); ticks.push(tk);
  }
  // STUDIO cells (EJ 2026-10-03: "include the latest blender renders too"): the newest ~10%
  // of the grid are the 1-bit Blender studio's latest pieces, merged into the SAME timeline;
  // applyOrder() shows the newest N×N items and hides the oldest wall cells to make room.
  // MODE (2026-10-04): flux = no studio cells, blender = the whole grid is studio pieces.
  SN = MODE === 'flux' ? 0 : MODE === 'blender' ? total : Math.max(1, Math.round(total * 0.1));
  sdivs = []; for (let j = 0; j < SN; j++) {
    const d = document.createElement('div'); d.className = 'studio';
    const img = document.createElement('img');
    img.style.cssText = `width:100%;height:100%;object-fit:${fitMode};display:block;image-rendering:pixelated`;
    const cp = document.createElement('div'); cp.className = 'cap';
    const tk = document.createElement('div'); tk.className = 'tick'; tk.style.background = 'var(--fam-studio)';
    d.appendChild(img); d.appendChild(cp); d.appendChild(tk); d.style.display = 'none';
    d.addEventListener('click', () => studioInspect(j));
    wall.appendChild(d); sdivs.push({ d, img, cp, item: null });
  }
  for (let i = 0; i < total; i++) loadCell(i);
  Promise.all(Array.from({ length: total }, (_, i) => loadTrace(i))).then(refreshBadges);
  loadStudio();
  updateCtl();
}

// ── studio cells ───────────────────────────────────────────────────────────────
let SN = 0, sdivs = [], STUDIO = [];                       // STUDIO = newest-first index items
const studioTs = name => { const m = /^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)/.exec(name || '');
  return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : 0; };
const studioTag = name => String(name || '').replace(/^\d{8}-\d{6}_/, '');
async function loadStudio() {
  try { STUDIO = ((await (await fetch('studio/index.json?t=' + Date.now(), { cache: 'no-store' })).json()).items) || []; } catch (e) { return; }
  sdivs.forEach((s, j) => {
    const it = STUDIO[j]; s.item = it || null;
    if (!it) return;
    const src = 'masterpieces/' + encodeURIComponent(it.name) + '.png';
    if (s.img.dataset.name !== it.name) { s.img.src = src; s.img.dataset.name = it.name; }
    const tag = studioTag(it.name), hero = tag.startsWith('HERO_');
    const recipe = (hero ? tag.slice(5) : tag).replace(/_/g, ' ');           // scene names keep their words
    s.cp.innerHTML = `<span class="l1"><span class="fam-studio">■</span> <b>studio</b> ${hero ? '<b>hero</b> ' : ''}${esc(recipe)}</span>` +
      `<span class="l2"><span class="m">${agoText(new Date(studioTs(it.name)))} · 1-bit Blender · click for recipe</span></span>`;
  });
  applyOrder(); drawTimeline();
}
async function studioInspect(j) {
  const it = sdivs[j] && sdivs[j].item; if (!it) return;
  ovimg.src = 'masterpieces/' + encodeURIComponent(it.name) + '.png';
  ovimg.style.imageRendering = 'pixelated';
  let r = null; try { r = await (await fetch('masterpieces/' + encodeURIComponent(it.name) + '.json?t=' + Date.now(), { cache: 'no-store' })).json(); } catch (e) {}
  const k = (r && r.knobs) || {};
  // no ★ / ▽ here on purpose: those train the WALL's taste model on img2img renders
  ovmeta.innerHTML = `<div class="title">■ studio piece</div>` +
    [['made', `${new Date(studioTs(it.name)).toLocaleString()} · ${agoText(new Date(studioTs(it.name)))}`],
     ['recipe', studioTag(it.name).replace(/_/g, ' · ')], ['scene', r && r.scene], ['data', r && (r.dataset || r.place)],
     ['signal', r && r.signal], ['dither', r && r.dither], ['lens', k.lens ? `${k.lens}mm ${k.lensy || ''}` : null],
     ['backdrop ★', r && r.wall_src], ['seed', r && r.seed], ['size', it.mb + ' MB']]
      .filter(([, v]) => v != null && v !== '').map(([a, b]) => `<div class="irow"><span class="k">${esc(a)}</span><span>${esc(b)}</span></div>`).join('') +
    // EVIDENCE (2026-10-04): the bare 3D scene before bitmapping, same camera (pieces from now on)
    `<div class="sec" id="wiresec" style="display:none">evidence — the 3D scene before bitmapping, same camera` +
      `<img class="wireimg" src="masterpieces/wire/${encodeURIComponent(it.name)}.png" style="display:block;width:100%;margin-top:6px;border:1px solid var(--rule)"` +
      ` onload="document.getElementById('wiresec').style.display='block'"></div>` +
    `<div class="sec">every studio piece: the renders page (\`renders\` on the Mac) · reproduce: studio-dev pin seed=${esc(r && r.seed)}</div>`;
  ov.style.display = 'flex';
}

function updateCtl() {
  document.getElementById('nlabel').textContent = `${N}×${N} · ${N * N}`;
  document.getElementById('fitbtn').textContent = fitMode === 'cover' ? '▦ fill' : '▢ fit';
  document.querySelectorAll('#ctl .mode').forEach(b => b.classList.toggle('on', b.dataset.m === MODE));
}

// ── source mode: flux | mix | blender ─────────────────────────────────────────
// The server's wall-mode.txt is the one truth: a click on ANY screen flips every wall
// within ~2s, and the Mac muse-loop stops sending FLUX jobs while it says "blender".
let MODE = 'mix';
const okMode = m => ['flux', 'mix', 'blender'].includes(m);
function applyMode(m) { if (!okMode(m) || m === MODE) return; MODE = m; if (divs) buildGrid(); else updateCtl(); }
function setMode(m) { if (!okMode(m)) return; fetch('setmode?m=' + m, { cache: 'no-store' }).catch(() => {}); applyMode(m); }
async function syncMode() {
  try { const r = await fetch('wall-mode.txt?t=' + Date.now(), { cache: 'no-store' });
        if (r.ok) applyMode((await r.text()).trim()); } catch (e) {}
}

// ── per-cell caption + edge tick, 2h timeline ─────────────────────────────────
async function loadWeights() {
  try { const d = await (await fetch('taste/taste-data.json?t=' + Date.now(), { cache: 'no-store' })).json();
        WMAP = {}; (d.weights || []).forEach(w => WMAP[w.knob + '|' + w.key] = w.w); refreshBadges(); } catch (e) {}
}
function refreshCap(i) {
  const t = traceCache[i];
  if (!t || !caps[i]) { if (caps[i]) caps[i].innerHTML = ''; return; }
  const src = String(t.init_source || 'pure').split('+')[0], fam = FAMILY(src);
  const style = String(t.style || '').split(',')[0].trim().toLowerCase();
  const ws = WMAP['style|' + style], wsm = WMAP['sampler|' + t.sampler];
  const mult = [ws, wsm].filter(x => x != null).reduce((a, b) => a * b, 1);
  const state = (favset.has(t.id) ? ' <span class="fav">★</span>' : '') + (downset.has(t.id) ? ' <span class="dn">▼</span>' : '');
  caps[i].innerHTML =
    `<span class="l1"><span class="fam-${fam}">${FGLYPH[fam]}</span> <b>${esc(KIT.srcName(src))}</b> ${esc(style || 'no style')} <span class="m">· ${esc(t.sampler || '')} · ${esc(t.steps || '')}st</span>${state}</span>` +
    `<span class="l2"><span class="m">odds</span> <b>×${mult.toFixed(2)}</b> <span class="m">· ${agoText(t.ts)}` +
    (t.render_ejtaste != null ? ` · ej ${t.render_ejtaste.toFixed(2)}` : '') + (t.ref_from ? ' · ref ★' : '') + `</span></span>`;
  const ageH = (Date.now() - new Date(t.ts).getTime()) / 3600e3;
  ticks[i].style.background = FCOL[fam];   // CSS var string from the kit
  ticks[i].style.opacity = Math.max(.25, 1 - ageH / 4);
}
let RECENT = [];
async function loadRecent() {
  try { RECENT = (await (await fetch('taste/recent.json?t=' + Date.now(), { cache: 'no-store' })).json()).renders || []; } catch (e) {}
  drawTimeline();
}
function drawTimeline() {
  const svg = document.getElementById('tl'); svg.innerHTML = '';
  const W = innerWidth, H = svg.clientHeight || 30, now = Date.now(), span = 2 * 3600e3, NS = 'http://www.w3.org/2000/svg';
  const fs = Math.max(9, Math.min(15, H * .32));                                   // label size follows the strip
  const narrow = W < 560, X0 = narrow ? 8 : fs * 34;                               // legend hides when narrow
  const xAt = age => W - 10 - (age / span) * (W - 10 - X0);
  const mk = (tag, a) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); svg.appendChild(n); return n; };
  const tickTop = H * .16, tickH = H * .44, tw = Math.max(1.5, Math.min(3, W / 900));
  // newest render age: if the loop has gone quiet, "now" turns amber and says how long (the only amber on the wall)
  const newest = RECENT.reduce((m, r) => Math.max(m, new Date(r.ts).getTime() || 0), 0);
  const quietM = newest ? (now - newest) / 60000 : Infinity, stale = quietM > 20 && MODE !== 'blender';   // paused on purpose ≠ broken
  for (let h = 0; h <= 4; h++) { const x = xAt(h * 1800e3);
    mk('line', { x1: x, x2: x, y1: tickTop, y2: tickTop + tickH, stroke: C.rule });
    const t = mk('text', { x, y: H - 2, 'text-anchor': h === 0 ? 'end' : 'middle', fill: h === 0 && stale ? C.warn : C.dim, 'font-size': fs, 'font-family': C.mono });
    t.textContent = h ? `-${h * 30}m` : stale ? (isFinite(quietM) ? `quiet ${KIT.ago(newest)}` : 'no renders') : 'now'; }
  const n = { text: 0, seeded: 0, taste: 0 };
  RECENT.forEach(r => { const age = now - new Date(r.ts).getTime(); if (age > span || age < 0) return;
    const x = xAt(age), fam = FAMILY(r.src); n[fam]++;
    mk('rect', { x: x - tw / 2, y: tickTop, width: tw, height: tickH, fill: FHEX[fam], opacity: r.down ? .3 : .9 });
    if (r.fav) { const s = mk('text', { x, y: tickTop, 'text-anchor': 'middle', fill: C.hi, 'font-size': fs }); s.textContent = '★'; } });
  const studioHex = cssvar('--fam-studio') || '#a9a9b0'; let ns = 0;          // studio pieces on the same strip
  (STUDIO || []).forEach(it => { const age = now - studioTs(it.name); if (age > span || age < 0) return; ns++;
    mk('rect', { x: xAt(age) - tw / 2, y: tickTop + tickH * .55, width: tw, height: tickH * .45, fill: studioHex }); });
  if (!narrow) {   // the legend doubles as the 2h tally per family
    const lg = mk('text', { x: 6, y: tickTop + tickH * .75, fill: C.dim, 'font-size': fs, 'font-family': C.mono });
    lg.innerHTML = `<tspan fill="${FHEX.text}">○</tspan> text ${n.text}  <tspan fill="${FHEX.seeded}">◇</tspan> seeded ${n.seeded}  <tspan fill="${FHEX.taste}">◆</tspan> ★ref/best-of ${n.taste}  <tspan fill="${studioHex}">■</tspan> studio ${ns}`;
  }
}
function setN(n) { n = clampN(n); if (n === N) return; N = n; localStorage.setItem('wallN', n); reportN(n); buildGrid(); }
function stepN(d) { setN(N + d); }
function toggleFit() { fitMode = fitMode === 'cover' ? 'contain' : 'cover'; localStorage.setItem('wallFit', fitMode);
  cells.forEach(c => c.style.objectFit = fitMode); sdivs.forEach(s => s.img.style.objectFit = fitMode); updateCtl(); }

function loadCell(i) {                       // load a finished cell's image once
  const src = 'wall_' + (i + 1) + '.png?t=' + Date.now();
  const probe = new Image();
  probe.onload = () => { cells[i].src = src; };
  probe.src = src;
}
async function loadTrace(i) {                 // cache the trace + id (for inspect + badge + date)
  try {
    const r = await fetch('wall_' + (i + 1) + '.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) { const t = await r.json(); traceCache[i] = t; cellIds[i] = t.id; }
  } catch (e) {}
}
async function loadFavs() {
  try { const r = await fetch('favlist?t=' + Date.now(), { cache: 'no-store' }); favset = new Set((await r.json()).ids || []); } catch (e) {}
  try { const r = await fetch('downlist?t=' + Date.now(), { cache: 'no-store' }); downset = new Set((await r.json()).ids || []); } catch (e) {}
}
function refreshBadges() {
  for (let i = 0; i < total; i++) {
    stars[i].style.display = (cellIds[i] && favset.has(cellIds[i])) ? 'block' : 'none';
    downs[i].style.display = (cellIds[i] && downset.has(cellIds[i]) && !favset.has(cellIds[i])) ? 'block' : 'none';
    refreshCap(i);
    const t = traceCache[i];
    const hasSrc = !!(t && (t.seed_image || (t.init_source && t.init_source !== 'pure')));
    srcs[i].classList.toggle('on', hasSrc);
    if (hasSrc) srcs[i].style.color = FCOL[FAMILY(t.init_source)];   // ◇ cyan for seeded, white for ★ref/best-of
  }
  applyOrder();
}
// CHRONOLOGICAL (EJ 2026-10-03): the generator paints slots round-robin, so slot order said
// nothing about time. Cells keep their slot index (inspect/pair/badges use it); only the
// VISUAL order changes: NEWEST TOP-RIGHT (the cell being painted), each row read right→left,
// rows getting older downward, OLDEST BOTTOM-LEFT (EJ's call).
function applyOrder() {
  // one timeline: wall cells (by trace ts; the live cell first) + the newest studio pieces
  if (MODE === 'blender') divs.forEach(d => d.style.display = 'none');           // studio pieces only
  const items = MODE === 'blender' ? [] : Array.from({ length: total }, (_, i) => ({ el: divs[i],
    t: i === live ? Infinity : (traceCache[i] && traceCache[i].ts ? new Date(traceCache[i].ts).getTime() : 0) }));
  (sdivs || []).forEach(s => { if (s.item) items.push({ el: s.d, t: studioTs(s.item.name) }); else s.d.style.display = 'none'; });
  items.sort((a, b) => b.t - a.t)                                                 // newest first
    .forEach((it, k) => {
      if (!it.el) return;
      if (k >= total) { it.el.style.display = 'none'; return; }                   // oldest overflow hides
      it.el.style.display = '';
      const row = Math.floor(k / N), col = N - 1 - (k % N);                       // right → left
      it.el.style.order = row * N + col;
    });
}

(async () => { await loadFavs(); await syncMode(); buildGrid(); loadWeights(); loadRecent(); })();
setInterval(syncMode, 2000);
setInterval(loadRecent, 30000);
setInterval(loadStudio, 60000);                     // studio pieces land every ~2-5 min
setInterval(loadWeights, 10 * 60 * 1000);
setInterval(() => { for (let i = 0; i < total; i++) refreshCap(i); }, 60000);   // ages tick
addEventListener('resize', drawTimeline);

async function syncLive() {
  try {
    const r = await fetch('live-slot.txt?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = parseInt((await r.text()).trim());
    if (v >= 1 && v <= total && (v - 1) !== live) {
      const prev = live;
      if (pair && pair.includes(v - 1)) endPair(false);   // a pair cell is being repainted — retry later
      loadCell(prev);                        // the cell we just left finished
      loadTrace(prev).then(refreshBadges);  // trace/badge/caption may be new
      live = v - 1;
      applyOrder();                          // the cell being painted moves to the end
    }
    if (v >= 1 && v <= total) markLive();   // also covers the first poll, when live-slot already == slot 1
  } catch (e) {}
}
// the cell being painted: a 2px white outline (greyscale — it's state, not a data hue).
// Other cells get '' (not 'none') so the CSS hover outline still works on them.
function markLive() {
  divs.forEach((d, i) => { d.style.outline = i === live ? '2px solid var(--hi)' : ''; d.style.outlineOffset = i === live ? '-2px' : ''; });
}
function pollLive() {                         // ONLY the live cell polls fast
  if (live >= total) return;
  const src = 'preview.png?t=' + Date.now();
  const probe = new Image();
  probe.onload = () => { if (cells[live]) cells[live].src = src; };
  probe.src = src;
}
setInterval(syncLive, 600);
setInterval(pollLive, 250);

// ── inspect + favorite ───────────────────────────────────────────────────────
const ov = document.getElementById('ov'), ovimg = document.getElementById('ovimg'), ovmeta = document.getElementById('ovmeta');
// aligned key/value rows; pass raw=true when v is already-escaped HTML
const row = (k, v, raw) => (v == null || v === '') ? '' :
  `<div class="irow"><span class="k">${k}</span><span>${raw ? v : esc(v)}</span></div>`;
const favLabel = on => on ? '★ favorited' : '☆ favorite', downLabel = on => on ? '▼ not for me' : '▽ not for me';

async function toggleFav(id) {
  if (!id) return;
  const on = favset.has(id) ? 0 : 1;
  try {
    const r = await fetch('fav?id=' + encodeURIComponent(id) + '&on=' + on, { cache: 'no-store' });
    const j = await r.json();
    if (j.fav) favset.add(id); else favset.delete(id);
    refreshBadges();
    const b = document.getElementById('favbtn');
    if (b) { b.textContent = favLabel(j.fav); b.classList.toggle('on', !!j.fav); }
  } catch (e) {}
}

async function toggleDown(id) {
  if (!id) return;
  const on = downset.has(id) ? 0 : 1;
  sendEvent('type=down&id=' + encodeURIComponent(id) + '&on=' + on);
  if (on) downset.add(id); else downset.delete(id);
  refreshBadges();
  const b = document.getElementById('downbtn');
  if (b) { b.textContent = downLabel(on); b.classList.toggle('on', !!on); }
}

async function inspect(i) {
  ovimg.style.imageRendering = '';                   // studioInspect sets pixelated for 1-bit art
  if (cellIds[i]) sendEvent('type=inspect&id=' + encodeURIComponent(cellIds[i]));   // a look ≈ half a star
  ovimg.src = 'wall_' + (i + 1) + '.png?t=' + Date.now();
  ovmeta.innerHTML = '<div class="dim">◆ loading trace…</div>';
  ov.style.display = 'flex';
  let t = traceCache[i];
  if (!t) { await loadTrace(i); t = traceCache[i]; }
  if (!t) {   // missing data = the one "needs attention" state → --warn
    ovmeta.innerHTML = '<div class="warn" style="font-size:18px">no trace for this cell yet</div>' +
      '<div class="dim" style="font-size:13px;margin-top:8px">Traces attach as each cell re-renders — give it a cycle.</div>';
    return;
  }
  const fam = FAMILY(t.init_source);
  const src = `<span class="fam-${fam}">${FGLYPH[fam]}</span> ` + esc(t.init_source) +
    (t.feedback_from_cell ? ' (from cell ' + esc(t.feedback_from_cell) + ')' : '');
  const str = (t.img2img_strength && t.img2img_strength !== 'none') ? t.img2img_strength : '—';
  const faved = !!(t.id && favset.has(t.id));
  const downed = !!(t.id && downset.has(t.id));
  ovmeta.innerHTML =
    `<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:14px">` +
      `<div class="title">${esc(t.prompt_subject)}</div>` +
      `<div class="btns" style="display:flex;flex-direction:column;gap:6px">` +
        `<button id="favbtn" class="kbtn${faved ? ' on' : ''}">${favLabel(faved)}</button>` +
        `<button id="downbtn" class="kbtn${downed ? ' on' : ''}">${downLabel(downed)}</button>` +
      `</div>` +
    `</div>` +
    row('cell', t.cell + ' / ' + total) +
    row('when', String(t.ts || '').replace('T', ' ') + (t.ts ? '  · ' + agoText(t.ts) : '')) +
    row('source', src, true) +
    row('size', t.size) +
    row('steps', t.steps) +
    row('img2img strength', str) +
    row('seed', t.seed) +
    row('prompt origin', t.prompt_from) +
    row('motif', t.source_motif) +
    row('mined from', t.mined_from) +
    (t.seed_image ?
      `<div class="sec"><span class="fam-${fam}">${FGLYPH[fam]}</span> seed image — what this cell was based on` +
        `<img class="seedimg" src="wall_${i + 1}-init.png?t=${Date.now()}">` +
      `</div>` : '') +
    `<div class="sec">full prompt sent to the model</div>` +
    `<div class="prompt">${esc(t.prompt_full)}</div>`;
  const b = document.getElementById('favbtn');
  if (b) b.onclick = () => toggleFav(t.id);
  const db = document.getElementById('downbtn');
  if (db) db.onclick = () => toggleDown(t.id);
}

// ── daily pair pick ──────────────────────────────────────────────────────────
// Once a day two finished cells get a dashed outline; one click says which you
// prefer. Pairwise picks are far more label-efficient than stars. Cells are
// picked at random positions, so there's no fixed left/right bias.
async function maybePair() {
  if (pair || ov.style.display === 'flex' || document.hidden || MODE === 'blender') return;
  if (localStorage.getItem('pairSkip') === new Date().toISOString().slice(0, 10)) return;
  try { if (!(await (await fetch('pairstate?t=' + Date.now(), { cache: 'no-store' })).json()).due) return; } catch (e) { return; }
  const ok = [];
  for (let i = 0; i < total; i++) if (i !== live && cellIds[i] && !favset.has(cellIds[i]) && !downset.has(cellIds[i])) ok.push(i);
  if (ok.length < 2) return;
  const a = ok.splice(Math.floor(Math.random() * ok.length), 1)[0], b = ok[Math.floor(Math.random() * ok.length)];
  pair = [a, b];
  pair.forEach(i => divs[i].classList.add('pairpick'));
  document.getElementById('pairbar').style.display = 'flex';
}
function pickPair(i) {
  const [a, b] = pair, lose = i === a ? b : a;
  sendEvent('type=pair&win=' + encodeURIComponent(cellIds[i]) + '&lose=' + encodeURIComponent(cellIds[lose]));
  endPair(false);
}
function endPair(skipped) {
  if (skipped) localStorage.setItem('pairSkip', new Date().toISOString().slice(0, 10));
  if (pair) pair.forEach(i => divs[i] && divs[i].classList.remove('pairpick'));
  pair = null;
  document.getElementById('pairbar').style.display = 'none';
}
setInterval(maybePair, 5 * 60 * 1000);
setTimeout(maybePair, 20 * 1000);
ov.addEventListener('click', e => { if (e.target === ov) ov.style.display = 'none'; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') ov.style.display = 'none';
  const m = { 1: 'flux', 2: 'mix', 3: 'blender' }[e.key]; if (m && !e.metaKey && !e.ctrlKey) setMode(m); });

function openFolder(which) { fetch('open?which=' + which, { cache: 'no-store' }).catch(() => {}); }
</script>
