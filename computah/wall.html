<!doctype html>
<html class="kit" style="background:#000">
<head><meta charset="utf-8"><title>IMAGINE wall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- shared palette + helpers for all computah screens (kit.css RULES = the color brief):
     greyscale unless the hue encodes data — --fam-text / --fam-seeded / --fam-taste = source
     family, --warn = stale/broken only. ★ = --hi, ▼ = ink on cells / --dim in text. -->
<link rel="stylesheet" href="kit.css">
<style>
  #wall > div { position: relative; overflow: hidden; background: var(--panel); cursor: pointer; }
  #wall > div:hover { outline: 1px solid var(--dim); outline-offset: -1px; }
  /* glyphs sit on arbitrary pixels: a 1px black halo is the minimum that keeps them legible */
  .star, .srcbadge, .down { position: absolute; top: 3px; pointer-events: none; text-shadow: 0 0 1px #000, 0 0 2px #000; line-height: 1; }
  .star { right: 5px; font-size: 16px; color: var(--hi); }
  .srcbadge { left: 6px; font-size: 14px; display: none; }      /* color = source family, set in JS */
  #wall > div:hover .srcbadge.on { display: block; }
  /* buttons = kit .kbtn (flat, em-padded, font inherited); containers set the 12px size */
  #ctl, #pairbar, #ovmeta .btns { font-size: 12px; }
  #ctl { position: fixed; top: 7px; left: 9px; z-index: 6; display: flex; gap: 6px; align-items: center; opacity: .45; transition: opacity .2s; background: var(--bg); padding: 3px 6px; }
  #ctl:hover { opacity: 1; }
  #ctl .sep { width: 1px; align-self: stretch; background: var(--faint); margin: 0 2px; }
  #ctl .lbl { color: var(--dim); font-size: 11px; }
  #ctl .kbtn.mode.on { color: var(--hi); border-color: var(--dim); }
  .down { right: 6px; font-size: 14px; color: var(--ink); }
  /* daily pair pick: two cells outlined, one click = which one EJ prefers */
  /* black frame + white dashes inside it: reads on white 1-bit studio pieces and on dark renders alike */
  #wall > div.pairpick::after { content: ''; position: absolute; inset: 0; border: 4px solid var(--bg); outline: 2px dashed var(--hi);
                                outline-offset: -6px; pointer-events: none; z-index: 3; }
  /* DENSE MODE (2026-09-30): caption strip + source edge tick per cell, 2h timeline */
  /* captions scale with the CELL (container queries), not the window: an 8x8 grid
     on a laptop and a 3x3 on a 4K panel both read right. */
  #wall > div { container-type: size; }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: .25em .5em .3em .8em; background: rgba(0,0,0,.72);
         font: clamp(9px, 4.2cqw, 20px)/1.3 var(--mono); color: var(--ink); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap b { color: var(--hi); font-weight: 600; } .cap .m { color: var(--dim); }
  .cap .fav { color: var(--hi); } .cap .dn { color: var(--dim); }
  .cap .l1, .cap .l2 { display: block; overflow: hidden; text-overflow: ellipsis; }
  .star { font-size: clamp(12px, 7cqw, 30px) !important; } .down { font-size: clamp(11px, 6cqw, 26px) !important; }
  .tick { width: clamp(2px, 1.1cqw, 6px) !important; }
  /* EJ 2026-09-30: small cells = images only (no caption, no tick); big cells get both lines */
  @container (max-width: 199px), (max-height: 150px) { .cap, .tick { display: none !important; } }
  .tick { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; pointer-events: none; }
  /* 2h render timeline strip — one wall, no modes (EJ 2026-09-30) */
  #tl { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: var(--tlh); background: var(--bg); border-top: 1px solid var(--rule); z-index: 5; }
  :root { --tlh: clamp(24px, 2.6vh, 48px); }
  #wall { height: calc(100vh - var(--tlh)) !important; }
  @media (max-width: 520px) { #tl { display: none; } #wall { height: 100vh !important; } }
  @media (max-width: 520px) { #ctl { flex-wrap: wrap; max-width: calc(100vw - 22px); } #ctl { font-size: 11px; } }
  #pairbar { position: fixed; top: 7px; left: 50%; transform: translateX(-50%); z-index: 7; display: none; gap: 10px; align-items: center;
             background: var(--bg); border: 1px solid var(--faint); padding: 5px 10px; color: var(--ink); font-size: 12px; }
  /* SAY-WHY (2026-10-06): after a ★ / ▼ / pair pick, an optional one-line reason. Same spot as
     the pair bar, above the inspect card. Enter saves, Esc drops it, ignoring it lets it go. */
  #why { position: fixed; top: 7px; left: 50%; transform: translateX(-50%); z-index: 12; display: none; gap: 8px; align-items: center;
         background: var(--bg); border: 1px solid var(--faint); padding: 5px 10px; color: var(--ink); font-size: 12px;
         max-width: calc(100vw - 32px); box-sizing: border-box; }
  #why.on { display: flex; }
  #why input { background: transparent; border: none; outline: none; color: var(--hi); font: inherit; width: 26em; max-width: 52vw; padding: 0; }
  #why input::placeholder { color: var(--dim); }
  #why .hint { color: var(--dim); white-space: nowrap; }
  @media (max-width: 520px) { #why .hint { display: none; } #why input { max-width: none; flex: 1; } }
  /* inspect overlay */
  #ov { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; z-index: 10; align-items: center; justify-content: center; cursor: zoom-out; }
  #card { display: flex; gap: 22px; max-width: 1120px; width: 92vw; max-height: 88vh; padding: 20px; box-sizing: border-box; background: var(--bg); border: 1px solid var(--rule); cursor: auto; }
  #ovimg { width: 44%; object-fit: contain; background: var(--bg); align-self: flex-start; }
  #ovmeta { flex: 1; overflow: auto; color: var(--ink); font-size: 14px; line-height: 1.5; }
  #ovmeta .title { color: var(--hi); font-size: 21px; line-height: 1.35; flex: 1; }
  #ovmeta .irow { display: grid; grid-template-columns: 11em 1fr; gap: 0 .8em; margin: 2px 0; }
  #ovmeta .irow .k { color: var(--dim); }
  #ovmeta .sec { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--rule); color: var(--dim); font-size: 12px; }
  #ovmeta .seedimg { display: block; margin-top: 6px; max-width: 240px; max-height: 170px; border: 1px solid var(--rule); background: var(--bg); }
  #ovmeta .prompt { color: var(--ink); font-size: 12px; line-height: 1.5; margin-top: 5px; }
  #ovmeta .kbtn { white-space: nowrap; text-align: left; }
  #ovmeta .kbtn.on { color: var(--hi); border-color: var(--dim); }
  @media (max-width: 700px) { #card { flex-direction: column; overflow: auto; } #ovimg { width: 100%; } }
  #ovimg { cursor: zoom-in; }
  /* NO SCROLLBARS (EJ 2026-10-06): the card grows to fit the image at its own size instead of
     squeezing it into 44% of 1120px; meta takes what's left. Wheel/trackpad still scroll long
     prompts, the bars just aren't drawn. The 1:1 view (#px) keeps its bars: they're the map. */
  #card { width: auto; max-width: 96vw; max-height: 92vh; }
  #ovimg { width: auto; height: auto; max-width: 62vw; max-height: calc(92vh - 40px); flex: none; }
  #ovmeta { flex: 1 1 30em; min-width: 24em; max-width: 44em; }
  #ovmeta .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #ovmeta .pair .sec { margin-top: 14px; }
  #ovmeta, #card, #ctl { scrollbar-width: none; }
  #ovmeta::-webkit-scrollbar, #card::-webkit-scrollbar, #ctl::-webkit-scrollbar { display: none; }
  @media (max-width: 700px) { #ovimg { width: 100%; max-width: 100%; max-height: none; } #ovmeta { min-width: 0; max-width: none; } }
  /* 1:1 (EJ 2026-10-06: "100% full-view pixel-real, no smallifying"): one image pixel = one
     screen pixel. CSS width = natural / devicePixelRatio so Windows 125/150% scaling doesn't
     blow it up either. Bigger than the screen → scroll/drag to pan; never scaled to fit. */
  #px { position: fixed; inset: 0; background: #000; z-index: 20; display: none; overflow: auto; cursor: grab; }
  #px.on { display: flex; }
  #px img { margin: auto; flex: none; display: block; image-rendering: pixelated; }
  #px.drag { cursor: grabbing; user-select: none; }
  #pxlbl { position: fixed; left: 8px; bottom: 6px; z-index: 21; font: 12px var(--mono); color: var(--dim); pointer-events: none; display: none; }
  #px.on + #pxlbl { display: block; }
  /* close buttons (EJ 2026-10-06): same top-right spot on the card and on the 1:1 view */
  .xbtn { position: fixed; top: 12px; right: 12px; background: var(--bg); font: 14px var(--mono); padding: .3em .8em; }
  #ov .xbtn { z-index: 11; }
  #pxclose { z-index: 22; display: none; }
  #px.on ~ #pxclose { display: block; }
  /* MOTION (EJ 2026-10-06 polish pass): the piece itself travels — cell → card → 1:1 and back
     (View Transitions shared element 'piece'); the rest of the page crossfades underneath.
     One ease everywhere: fast out of the gate, long soft landing. prefers-reduced-motion = none. */
  :root { --ease: cubic-bezier(.2, .8, .2, 1); }
  ::view-transition-group(piece) { animation-duration: .46s; animation-timing-function: var(--ease); }
  ::view-transition-old(piece), ::view-transition-new(piece) { width: 100%; height: 100%; object-fit: cover; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  #ovmeta.enter > * { animation: rise .5s var(--ease) both; animation-delay: calc(90ms + min(var(--i, 0), 10) * 26ms); }
  #wall > div { outline: 1px solid transparent; outline-offset: -1px; transition: outline-color .35s var(--ease); }
  #wall > div > img { transition: transform 1.1s var(--ease); }
  #wall > div:hover > img { transform: scale(1.02); }
  .kbtn { transition: color .15s, border-color .15s; }
  #pxlbl { transition: opacity .3s; }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
    #ovmeta.enter > *, #wall > div, #wall > div > img, .kbtn { animation: none !important; transition: none !important; }
    #wall > div:hover > img { transform: none; }
  }
</style>
</head>
<body style="margin:0;overflow:hidden">
<div id="wall" style="display:grid;gap:2px;width:100vw;height:100vh;padding:2px;box-sizing:border-box"></div>

<!-- top-left controls (fade in on hover so they don't clutter the ambient wall) -->
<div id="ctl">
  <span class="lbl">grid</span>
  <button class="kbtn" onclick="stepN(-1)">−</button>
  <span id="nlabel" style="color:var(--ink);min-width:50px;text-align:center"></span>
  <button class="kbtn" onclick="stepN(1)">+</button>
  <button class="kbtn" id="fitbtn" onclick="toggleFit()"></button>
  <!-- source toggle (EJ 2026-10-04): shared via the server, so every screen + the generator follow -->
  <span class="sep"></span>
  <span class="lbl">show</span>
  <button class="kbtn mode" data-m="flux" onclick="setMode('flux')" title="key 1">○ flux</button>
  <button class="kbtn mode" data-m="mix" onclick="setMode('mix')" title="key 2">◇ both</button>
  <button class="kbtn mode" data-m="blender" onclick="setMode('blender')" title="key 3">■ blender</button>
  <!-- folder buttons live here too (were bottom-right, where they covered a caption) -->
  <span class="sep"></span>
  <button class="kbtn" onclick="openFolder('gallery')">◆ all renders</button>
  <button class="kbtn" onclick="openFolder('favorites')">★ favorites</button>
</div>
<svg id="tl" aria-label="last 2 hours of renders"></svg>

<!-- pair pick prompt (~10 a day, 60-90 min apart, only while EJ is around) -->
<div id="pairbar"><span class="hi">◆</span> which of the two outlined do you like more? <button class="kbtn" title="fewer for a while" onclick="endPair('skip')">skip</button></div>
<!-- optional reason after a verdict -->
<div id="why"><span id="whyg" class="hi">◆</span><input id="whyin" maxlength="200" placeholder="why? (optional)" autocomplete="off" spellcheck="false"><span class="hint">enter saves · esc</span></div>

<!-- click-to-inspect overlay -->
<div id="ov">
  <button class="kbtn xbtn" title="esc" onclick="closeCard()">× close</button>
  <div id="card">
    <img id="ovimg">
    <div id="ovmeta"></div>
  </div>
</div>
<!-- 1:1 pixel view: click the inspect image (or shift-click a cell) -->
<div id="px"><img id="pximg"></div>
<div id="pxlbl"></div>
<button class="kbtn xbtn" id="pxclose" title="esc" onclick="pxClose()">× close</button>

<script src="kit.js"></script>
<script>
const wall = document.getElementById('wall');
const clampN = n => Math.max(2, Math.min(8, n || 4));
// user's UI choice (localStorage) wins; else the ?n= the wall was opened with; else 4
let N = clampN(parseInt(localStorage.getItem('wallN') || new URLSearchParams(location.search).get('n') || '4'));
// ?view=1 = read-only viewer: never steers the generator's grid size (any extra
// screen looking at the wall used to resize the real wall).
const VIEW_ONLY = new URLSearchParams(location.search).get('view') === '1';
const reportN = n => { if (VIEW_ONLY) return; try { fetch('setn?n=' + n, { cache: 'no-store' }); } catch (e) {} };
reportN(N);
let fitMode = localStorage.getItem('wallFit') || 'cover';   // cover = fill/crop, contain = fit/letterbox (true aspect)
let favset = new Set(), downset = new Set();
let WMAP = {};                                           // learned weights: 'knob|key' -> multiplier
// source family / glyphs / names / escaping all come from the shared kit (kit.js)
const { FAMILY, FCOL, FHEX, FGLYPH, esc } = KIT;
// SVG presentation attributes can't take var(): read the kit's greys once
const { cssvar, agoText } = KIT;
const C = { hi: cssvar('--hi') || '#fff', dim: cssvar('--dim') || '#6f6f78', rule: cssvar('--rule') || '#1f1f24', warn: cssvar('--warn') || '#ffb000', mono: cssvar('--mono') || 'monospace' };
let pair = null;   // { a, b, t0 } while a pair pick is showing; a side = { kind, i | j, id, el }
let sfavset = new Set(), sdownset = new Set();             // studio piece names starred / thumbs-downed

let total, divs, cells, stars, srcs, downs, caps, ticks, cellIds, traceCache, live = 0;
// taste signals → preview-server /event → taste\events.jsonl (learned from on the Mac)
const sendEvent = qs => { try { fetch('event?' + qs + '&t=' + Date.now(), { cache: 'no-store' }); } catch (e) {} };

// ── motion ───────────────────────────────────────────────────────────────────
const MOTION = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.2, .8, .2, 1)';
const shown = el => !!(el && el.isConnected && el.getClientRects().length);
// shared-element morph: `from` becomes `to` across the DOM change `update`. Anything the
// browser can't do (no View Transitions, element hidden) just runs `update` instantly.
function morph(from, to, update) {
  if (!MOTION || !document.startViewTransition || document.hidden || !shown(from)) { update(); return; }
  from.style.viewTransitionName = 'piece';
  const vt = document.startViewTransition(async () => {
    from.style.viewTransitionName = '';
    await update();
    if (shown(to)) to.style.viewTransitionName = 'piece';
  });
  vt.ready.catch(() => {});                                   // a skipped transition still applies `update`
  vt.finished.finally(() => { if (to) to.style.viewTransitionName = ''; });
}
// swap an <img> to a new src with a crossfade: the old frame stays painted underneath
function fadeSwap(img, src, delay) {
  const old = img.getAttribute('src');
  if (MOTION && old) img.parentNode.style.background = `var(--panel) url("${old}") center / ${fitMode} no-repeat`;
  img.src = src;
  if (!MOTION) return;
  img.animate([{ opacity: 0 }, { opacity: 1 }], { duration: old ? 900 : 600, delay: delay || 0, easing: 'ease-out', fill: 'backwards' })
    .finished.then(() => { img.parentNode.style.background = ''; }, () => {});
}

function buildGrid() {
  if (pair) endPair('interrupted');                          // the cells are about to be replaced
  total = N * N; live = 0; builtAt = performance.now();
  wall.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  wall.style.gridTemplateRows = `repeat(${N}, 1fr)`;
  wall.innerHTML = '';
  divs = []; cells = []; stars = []; srcs = []; downs = []; caps = []; ticks = []; cellIds = []; traceCache = [];
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    const img = document.createElement('img');
    img.style.cssText = `width:100%;height:100%;object-fit:${fitMode};display:block`;
    const st = document.createElement('span'); st.className = 'star'; st.textContent = '★'; st.style.display = 'none';
    const sc = document.createElement('span'); sc.className = 'srcbadge'; sc.textContent = '◇'; sc.title = 'img2img — had a source image (click to see it)';
    const dn = document.createElement('span'); dn.className = 'down'; dn.textContent = '▼'; dn.style.display = 'none';
    const cp = document.createElement('div'); cp.className = 'cap';
    const tk = document.createElement('div'); tk.className = 'tick';
    d.appendChild(img); d.appendChild(st); d.appendChild(sc); d.appendChild(dn); d.appendChild(cp); d.appendChild(tk);
    d.addEventListener('click', e => e.shiftKey ? pixelView(img.getAttribute('src') || 'wall_' + (i + 1) + '.png?t=' + Date.now(), false, img)
      : pairSide('flux', i) ? pickPair(pairSide('flux', i)) : inspect(i));
    wall.appendChild(d);
    divs.push(d); cells.push(img); stars.push(st); srcs.push(sc); downs.push(dn); caps.push(cp); ticks.push(tk);
  }
  // STUDIO cells (EJ 2026-10-03: "include the latest blender renders too"): the newest ~10%
  // of the grid are the 1-bit Blender studio's latest pieces, merged into the SAME timeline;
  // applyOrder() shows the newest N×N items and hides the oldest wall cells to make room.
  // MODE (2026-10-04): flux = no studio cells, blender = the whole grid is studio pieces.
  SN = MODE === 'flux' ? 0 : MODE === 'blender' ? total : Math.max(1, Math.round(total * 0.1));
  sdivs = []; for (let j = 0; j < SN; j++) {
    const d = document.createElement('div'); d.className = 'studio';
    const img = document.createElement('img');
    img.style.cssText = `width:100%;height:100%;object-fit:${fitMode};display:block;image-rendering:pixelated`;
    const cp = document.createElement('div'); cp.className = 'cap';
    const tk = document.createElement('div'); tk.className = 'tick'; tk.style.background = 'var(--fam-studio)';
    d.appendChild(img); d.appendChild(cp); d.appendChild(tk); d.style.display = 'none';
    d.addEventListener('click', e => {
      const it = sdivs[j] && sdivs[j].item;
      if (e.shiftKey && it) pixelView('masterpieces/' + encodeURIComponent(it.name) + '.png', !it.name.includes('_color_'), img);
      else if (pairSide('studio', j)) pickPair(pairSide('studio', j));
      else studioInspect(j);
    });
    wall.appendChild(d); sdivs.push({ d, img, cp, item: null });
  }
  for (let i = 0; i < total; i++) loadCell(i);
  Promise.all(Array.from({ length: total }, (_, i) => loadTrace(i))).then(refreshBadges);
  loadStudio();
  updateCtl();
}

// ── studio cells ───────────────────────────────────────────────────────────────
let SN = 0, sdivs = [], STUDIO = [];                       // STUDIO = newest-first index items
const studioTs = name => { const m = /^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)/.exec(name || '');
  return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : 0; };
const studioTag = name => String(name || '').replace(/^\d{8}-\d{6}_/, '');
async function loadStudio() {
  try { STUDIO = ((await (await fetch('studio/index.json?t=' + Date.now(), { cache: 'no-store' })).json()).items) || []; } catch (e) { return; }
  sdivs.forEach((s, j) => {
    const it = STUDIO[j]; s.item = it || null;
    if (!it) return;
    const src = 'masterpieces/' + encodeURIComponent(it.name) + '.png';
    if (s.img.dataset.name !== it.name) { fadeSwap(s.img, src); s.img.dataset.name = it.name; }
    s.img.style.imageRendering = it.name.includes('_color_') ? 'auto' : 'pixelated';   // color pieces aren't 1-bit
    const tag = studioTag(it.name), hero = tag.startsWith('HERO_');
    const recipe = (hero ? tag.slice(5) : tag).replace(/_/g, ' ');           // scene names keep their words
    s.cp.innerHTML = `<span class="l1"><span class="fam-studio">■</span> <b>studio</b> ${hero ? '<b>hero</b> ' : ''}${esc(recipe)}</span>` +
      `<span class="l2"><span class="m">${agoText(new Date(studioTs(it.name)))} · 1-bit Blender · click for recipe</span></span>`;
  });
  // a new piece shifts every studio slot by one: the pair outline follows its piece to the new slot
  if (pair) {
    const sides = [pair.a, pair.b], slot = p => sdivs.findIndex(s => s.item && s.item.name === p.id);
    if (sides.some(p => p.kind === 'studio' && slot(p) < 0)) endPair('interrupted');   // piece left the index
    else {
      sides.forEach(p => p.el.classList.remove('pairpick'));
      sides.forEach(p => { if (p.kind === 'studio') { p.j = slot(p); p.el = sdivs[p.j].d; } p.el.classList.add('pairpick'); });
    }
  }
  applyOrder(); drawTimeline();
}
async function studioInspect(j) {
  const it = sdivs[j] && sdivs[j].item; if (!it) return;
  ovimg.src = 'masterpieces/' + encodeURIComponent(it.name) + '.png';
  ovimg.style.imageRendering = it.name.includes('_color_') ? 'auto' : 'pixelated';
  let r = null; try { r = await (await fetch('masterpieces/' + encodeURIComponent(it.name) + '.json?t=' + Date.now(), { cache: 'no-store' })).json(); } catch (e) {}
  const k = (r && r.knobs) || {};
  // studio ★ keeps its own folder (studiofav: favorites\studio + EJ's Discord channel, 2026-10-05).
  // 2026-10-06: ★, ▽ and the look itself ALSO land in taste\events.jsonl with kind=studio, so the
  // preference model sees Blender pieces next to FLUX renders.
  sendEvent('type=inspect&kind=studio&id=' + encodeURIComponent(it.name));
  let sfav = false, sdown = sdownset.has(it.name);
  try { sfav = ((await (await fetch('studiofavlist?t=' + Date.now(), { cache: 'no-store' })).json()).ids || []).includes(it.name); } catch (e) {}
  if (sfav) sfavset.add(it.name); else sfavset.delete(it.name);
  const sLabel = on => on ? '★ favorited' : '☆ favorite';
  ovmeta.innerHTML = `<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:14px">` +
      `<div class="title">■ studio piece</div>` +
      `<div class="btns" style="display:flex;flex-direction:column;gap:6px"><button id="sfavbtn" class="kbtn${sfav ? ' on' : ''}">${sLabel(sfav)}</button>` +
      `<button id="sdownbtn" class="kbtn${sdown ? ' on' : ''}">${downLabel(sdown)}</button></div></div>` +
    [['made', `${new Date(studioTs(it.name)).toLocaleString()} · ${agoText(new Date(studioTs(it.name)))}`],
     ['recipe', studioTag(it.name).replace(/_/g, ' · ')], ['scene', r && r.scene], ['data', r && (r.dataset || r.place)],

// rows getting older downward, OLDEST BOTTOM-LEFT (EJ's call).

  const studio = [];
  sdivs.forEach((s, j) => { const n = s.item && s.item.name;
    if (n && shown(s.d) && !sfavset.has(n) && !sdownset.has(n)) studio.push({ kind: 'studio', j, id: n, el: s.d }); });
  return { flux, studio };
}
function choosePair() {
  const { flux, studio } = pairPool(), take = arr => arr.splice(Math.floor(Math.random() * arr.length), 1)[0];
  const combos = [];                                       // [kindA, kindB, weight]
  if (flux.length >= 2) combos.push(['flux', 'flux', 2]);
  if (flux.length && studio.length) combos.push(['flux', 'studio', 1]);
  if (studio.length >= 2) combos.push(['studio', 'studio', 1]);
  if (!combos.length) return null;
  let r = Math.random() * combos.reduce((a, c) => a + c[2], 0), c = combos[0];
  for (const x of combos) { if ((r -= x[2]) < 0) { c = x; break; } }
  const pools = { flux, studio }, two = [take(pools[c[0]]), take(pools[c[1]])];
  return Math.random() < .5 ? two : two.reverse();
}
const overlayOpen = () => ov.style.display === 'flex' || px.classList.contains('on') || !!whyCtx;
async function maybePair(reoffer) {
  if (pair || overlayOpen() || document.hidden) return;
  if (!(await present())) return;
  if (!reoffer) {                                          // a re-offer after an interruption doesn't count again
    try { if (!(await (await fetch('pairstate?t=' + Date.now(), { cache: 'no-store' })).json()).due) return; } catch (e) { return; }
  }
  if (pair || overlayOpen() || document.hidden) return;   // things moved while we waited
  const two = choosePair(); if (!two) return;
  if (!reoffer) fetch('pairmark?what=offer&t=' + Date.now(), { cache: 'no-store' }).catch(() => {});
  pair = { a: two[0], b: two[1], t0: Date.now() };
  [pair.a, pair.b].forEach(p => p.el.classList.add('pairpick'));
  document.getElementById('pairbar').style.display = 'flex';
  clearTimeout(pairTimer); pairTimer = setTimeout(() => endPair('timeout'), PAIR_TTL);
}
function pickPair(side) {
  if (!pair) return;
  const win = pair[side], lose = pair[side === 'a' ? 'b' : 'a'], e = encodeURIComponent;
  sendEvent(`type=pair&win=${e(win.id)}&lose=${e(lose.id)}&win_kind=${win.kind}&lose_kind=${lose.kind}&ms=${Date.now() - pair.t0}`);
  endPair('picked');
  offerWhy({ id: win.id, kind: win.kind, verdict: 'pair', lose: lose.id, lose_kind: lose.kind });
}
// how: picked | skip | timeout | interrupted (a side got repainted / shifted / hidden → offer two others)
function endPair(how) {
  clearTimeout(pairTimer);
  const had = !!pair;
  if (pair) [pair.a, pair.b].forEach(p => p.el.classList.remove('pairpick'));
  pair = null;
  document.getElementById('pairbar').style.display = 'none';
  if (how === 'skip') fetch('pairmark?what=skip&t=' + Date.now(), { cache: 'no-store' }).catch(() => {});
  if (how === 'interrupted' && had) setTimeout(() => maybePair(true), 4000);
}
setInterval(maybePair, PAIR_POLL);
setTimeout(maybePair, 20 * 1000);

// ── say-why ──────────────────────────────────────────────────────────────────
// After a ★, a ▼ or a pair pick, an optional one-line reason (event type=why). The verdict is
// already saved before this shows. Enter saves, Esc drops it; left alone it closes itself
// (20 s untouched, 60 s after the last keystroke), keeping anything typed. A new verdict
// replaces it the same way.
const whyEl = document.getElementById('why'), whyIn = document.getElementById('whyin'), whyG = document.getElementById('whyg');
let whyCtx = null, whyTimer = 0;
function offerWhy(ctx) {
  if (whyCtx) closeWhy(true);
  whyCtx = ctx;
  whyG.textContent = { star: '★', down: '▼', pair: '◆' }[ctx.verdict] || '◆';
  whyIn.value = ''; whyEl.classList.add('on');
  try { whyIn.focus({ preventScroll: true }); } catch (e) {}
  armWhy();
}
function armWhy() { clearTimeout(whyTimer); whyTimer = setTimeout(() => closeWhy(true), whyIn.value.trim() ? 60e3 : 20e3); }
function closeWhy(save) {
  clearTimeout(whyTimer);
  const c = whyCtx, txt = whyIn.value.trim(), e = encodeURIComponent;
  whyCtx = null; whyEl.classList.remove('on'); whyIn.value = '';
  if (document.activeElement === whyIn) whyIn.blur();
  if (save && c && txt) sendEvent(`type=why&id=${e(c.id)}&kind=${c.kind}&verdict=${c.verdict}&text=${e(txt)}` +
    (c.lose ? `&lose=${e(c.lose)}&lose_kind=${c.lose_kind}` : ''));
}
whyIn.addEventListener('keydown', e => {
  e.stopPropagation();                                     // typing "2" must not flip the wall mode
  if (e.key === 'Enter') closeWhy(true); else if (e.key === 'Escape') closeWhy(false);
});
whyIn.addEventListener('input', armWhy);
ov.addEventListener('click', e => { if (e.target === ov) closeCard(); });

// ── 1:1 pixel view ───────────────────────────────────────────────────────────
const px = document.getElementById('px'), pximg = document.getElementById('pximg'), pxlbl = document.getElementById('pxlbl');
let pxFrom = null;
async function pixelView(src, pixelated, from) {
  pximg.style.imageRendering = pixelated === false ? 'auto' : '';
  pximg.src = src;
  try { await pximg.decode(); } catch (e) {}                 // size it before it's shown, so the morph lands true
  const w = pximg.naturalWidth, h = pximg.naturalHeight, dpr = window.devicePixelRatio || 1;
  pximg.style.width = (w / dpr) + 'px'; pximg.style.height = (h / dpr) + 'px';
  pxlbl.textContent = `1:1 · ${w}×${h} px` + (w / dpr > innerWidth || h / dpr > innerHeight ? ' · drag to pan' : '') + ' · click / esc to close';
  pxFrom = from;
  morph(from, pximg, () => {
    px.classList.add('on');
    px.scrollLeft = (px.scrollWidth - px.clientWidth) / 2; px.scrollTop = (px.scrollHeight - px.clientHeight) / 2;
  });
}
function pxClose() { if (px.classList.contains('on')) morph(pximg, pxFrom, () => px.classList.remove('on')); }
ovimg.addEventListener('click', () => pixelView(ovimg.src, ovimg.style.imageRendering !== 'auto', ovimg));
// drag pans; a click without a drag closes
let pxDrag = null;
px.addEventListener('mousedown', e => { pxDrag = { x: e.clientX, y: e.clientY, l: px.scrollLeft, t: px.scrollTop, moved: false }; e.preventDefault(); });
addEventListener('mousemove', e => {
  if (!pxDrag) return;
  const dx = e.clientX - pxDrag.x, dy = e.clientY - pxDrag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { pxDrag.moved = true; px.classList.add('drag'); }
  px.scrollLeft = pxDrag.l - dx; px.scrollTop = pxDrag.t - dy;
});
addEventListener('mouseup', () => { if (pxDrag && !pxDrag.moved && px.classList.contains('on')) pxClose(); pxDrag = null; px.classList.remove('drag'); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && px.classList.contains('on')) { pxClose(); return; }   // esc peels one layer at a time
  if (e.key === 'Escape') closeCard();
  const m = { 1: 'flux', 2: 'mix', 3: 'blender' }[e.key]; if (m && !e.metaKey && !e.ctrlKey) setMode(m); });

function openFolder(which) { fetch('open?which=' + which, { cache: 'no-store' }).catch(() => {}); }
</script>
