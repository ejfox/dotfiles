<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ejfox cheatsheet</title>
<style>
  :root {
    --bg: #000;
    --bg2: #0a0608;
    --bg3: #150d10;
    --fg: #f2cfdf;
    --fg80: rgba(245,225,235,1.0);
    --fg60: rgba(245,225,235,0.92);
    --fg40: rgba(245,225,235,0.85);
    --fg20: rgba(245,225,235,0.6);
    --fg10: rgba(245,225,235,0.18);
    /* brighter pink: #e60067 was too dark to read as text/keys on black.
       (255,61,132) is far more legible while staying vulpes-pink. */
    --base: #ff4d8d;
    --base80: rgba(255,77,141,0.92);
    --base50: rgba(255,77,141,0.72);
    --base30: rgba(255,77,141,0.42);
    --base15: rgba(255,77,141,0.22);
    --base08: rgba(255,77,141,0.1);
    --teal: #7bf0f9;
    --teal70: rgba(123,240,249,0.85);
    --teal40: rgba(123,240,249,0.5);
    --gold: #ffd489;
    --gold70: rgba(255,212,137,0.9);
    --gold40: rgba(255,212,137,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Monaspace Krypton', 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 11px;
    font-weight: 350;                     /* lighter strokes, but still readable */
    -webkit-font-smoothing: antialiased;  /* keep thin weight crisp on retina */
    background: var(--bg);
    color: var(--fg80);
    padding: 4px 6px;
    line-height: 1.25;
  }
  /* fluid columns: as many ~235px columns as fit the window width. A narrow
     panel is one column; a wide one fills edge to edge. */
  .grid { column-width: 235px; column-gap: 10px; }

  /* Header = the tab strip. One tab (group) shows at a time; "all" is a closed
     outline of every card. Text tabs, no boxes: the active one is bright with a
     hairline under it. Keys 1-9 switch. */
  header {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 2px 4px;
    padding-bottom: 3px; margin-bottom: 3px;
    border-bottom: 1px solid var(--fg10);
  }
  header button {
    background: none; border: 0; border-bottom: 1px solid transparent;
    color: var(--fg20); font-family: inherit; font-size: 10px;
    padding: 1px 4px; cursor: pointer;
  }
  header button:hover { color: var(--fg80); }
  #tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; }
  #tabs button { text-transform: uppercase; letter-spacing: 1px; }
  #tabs button.active { color: var(--fg80); border-bottom-color: var(--fg80); }
  header .controls { display: flex; gap: 2px; margin-left: auto; }
  header .controls button { font-size: 9px; }

  /* tip of the moment: one dim line (two at most), click for the next */
  #tipbar {
    display: flex; gap: 8px; align-items: baseline;
    margin: 0 0 5px; padding: 0 4px;
    font-size: 9px; color: var(--fg20); cursor: pointer; user-select: none;
  }
  #tipbar .t { text-transform: uppercase; letter-spacing: 1px; color: var(--base50); }
  #tiptext {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #tipbar:hover #tiptext { color: var(--fg60); }

  /* Floating search: hidden until you press "/". Fixed to the panel viewport so
     it works no matter how far you've scrolled. Searches every tab. */
  #search {
    position: fixed; top: 8px; left: 50%; z-index: 50;
    width: min(280px, 72%);
    background: var(--bg3); border: 1px solid var(--base50);
    color: var(--fg); font-family: inherit; font-size: 11px;
    padding: 5px 10px; border-radius: 5px; outline: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    opacity: 0; pointer-events: none;
    transform: translateX(-50%) translateY(-10px);
    transition: opacity .12s ease, transform .12s ease;
  }
  #search.on {
    opacity: 1; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  #search::placeholder { color: var(--fg20); }

  /* group heading: only on the "all" tab and above the tips index */
  h2.g {
    column-span: all;
    font-size: 9px; font-weight: inherit; text-transform: uppercase; letter-spacing: 2px;
    color: var(--fg80); margin: 10px 0 4px; padding-top: 5px;
    border-top: 1px solid var(--fg10);
  }
  h2.g:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  h2.g .sub { color: var(--fg20); letter-spacing: 0.5px; text-transform: none; }

  details {
    break-inside: avoid;
    margin-bottom: 5px;
    background: var(--bg2);
    border-radius: 3px;
    border-left: 2px solid var(--base15);
    transition: border-color 0.15s;
  }
  details[open] { padding-bottom: 3px; border-left-color: var(--base30); }
  summary {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px;
    padding: 4px 6px; cursor: pointer; list-style: none;
    display: flex; justify-content: space-between; align-items: center;
    user-select: none; color: var(--fg40);
    transition: color 0.15s;
  }
  details[open] summary { color: var(--fg80); }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "\25B8"; font-size: 7px; color: var(--fg20); transition: transform 0.15s; }
  details[open] summary::after { transform: rotate(90deg); color: var(--base50); }
  summary:hover { color: var(--fg80); }
  summary .ct { color: var(--fg20); margin-left: 6px; margin-right: auto; letter-spacing: 0; }

  /* app-context card: its app (Final Cut, Logic) is frontmost or running */
  summary .badge {
    font-size: 7px; letter-spacing: 0.5px; padding: 0 4px; border-radius: 2px;
    margin-right: 6px; text-transform: none;
  }
  summary .badge.live { background: rgba(123,240,249,0.14); color: #7bf0f9; }

  .c { padding: 0 6px; }
  /* Two-column TABLE: keys in a stable left column, descriptions LEFT-aligned
     so every description starts at the same x and wraps ragged-right. */
  .r {
    display: grid; grid-template-columns: minmax(4.6em, auto) 1fr;
    column-gap: 10px; align-items: baseline;
    padding: 1.5px 4px; margin: 0 -4px; border-radius: 2px;
  }
  /* stacked row: a long key (a shell command) takes its own line and the
     description sits under it, indented. Set by `cheat gen` for keys > 16 chars. */
  /* details.stk = a command card (most keys are commands): every row stacks. */
  .r.st, .stk .r { display: block; }
  .r.st kbd, .stk .r kbd { display: block; }
  .r.st .d, .stk .r .d { display: block; padding-left: 1.2em; }
  /* Tufte-subtle zebra: just enough to rail the eye from key to meaning. */
  .r:nth-child(even):not(.dd):not(.highlight) { background: rgba(245,225,235,0.035); }
  .r:hover { background: var(--base08); }
  .r.highlight { background: var(--base15); }

  .r.dd {
    background: rgba(123,240,249,0.06);
    border-left: 2px solid rgba(123,240,249,0.4);
    padding-left: 4px;
  }
  .r.dd kbd { color: var(--teal); }
  .r.dd .d { color: rgba(123,240,249,0.62); }
  .r.dd:hover { background: rgba(123,240,249,0.1); }

  kbd {
    font-family: inherit; font-size: 10px; color: var(--fg80);
    white-space: normal; overflow-wrap: break-word;
  }
  .d {
    color: var(--fg40); text-align: left;
    white-space: normal; overflow-wrap: break-word;
    font-size: 10px;
  }
  /* a keyless row (description only) spans both columns */
  .r > .d:only-child { grid-column: 1 / -1; }
  .r:hover .d { color: var(--fg60); }

  .div { height: 1px; background: var(--fg10); margin: 3px 0; }

  /* prose notes: roman, not italic. Dim; <em> lifts the key terms in teal. */
  .n { font-size: 9px; color: var(--fg40); font-style: normal; padding: 2px 0 3px;
    line-height: 1.45;
  }
  .n em { color: var(--teal); font-style: normal; }

  .o { font-size: 8.5px; color: var(--fg40); padding: 1px 0; letter-spacing: 0.3px; }
  .o::before { content: "\21B3 "; color: var(--base30); }

  /* sub-group label inside a card */
  .lbl {
    font-size: 7.5px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--base50); margin: 5px 0 1px; padding-top: 3px;
    border-top: 1px solid var(--base08);
  }
  .lbl:first-child { border-top: 0; padding-top: 0; }

  /* strategy callout: "how to actually use this", not just what the keys are */
  .strat {
    margin: 5px -2px 2px; padding: 5px 8px; border-radius: 3px;
    background: rgba(110,237,247,0.04); border-left: 2px solid var(--teal40);
    font-size: 8.5px; color: var(--fg60); line-height: 1.5;
  }
  .strat .h {
    display: block; text-transform: uppercase; letter-spacing: 0.6px;
    font-size: 8px; color: var(--teal70); margin-bottom: 2px;
  }
  .strat .step { display: block; padding: 0.5px 0; }
  .strat kbd { font-size: 9.5px; color: var(--teal); }

  details.primary { border-left-color: var(--base30); }
  details.primary[open] { border-left-color: var(--base); }
  details.primary[open] summary { color: var(--fg); }

  details.accent { border-left-color: rgba(110,237,247,0.2); }
  details.accent[open] { border-left-color: rgba(110,237,247,0.5); }
  details.accent[open] summary { color: var(--teal); }
  details.accent kbd { color: var(--teal); }

  /* lazygit gold accent */
  details.gold { border-left-color: rgba(247,200,110,0.2); }
  details.gold[open] { border-left-color: rgba(247,200,110,0.5); }
  details.gold[open] summary { color: var(--gold70); }

  details.gold kbd { color: var(--gold); }
  details.primary kbd { color: var(--base80); }
  details.prose { border-left-color: var(--fg10); }
  details.prose[open] summary { color: var(--fg40); }
  details.prose .d { font-style: italic; padding-left: 0; }

  .hidden { display: none !important; }

  html, body { overflow-x: hidden; } /* never a horizontal bar */
</style>
</head>
<body>

<header>
  <nav id="tabs">
    {{TABS}}
  </nav>
  <span class="controls">
    <button onclick="openSearch()" title="search every tab (/)">/</button>
    <button onclick="toggleAll(true)" title="open every card on this tab">open</button>
    <button onclick="toggleAll(false)" title="close every card on this tab">shut</button>
    <button onclick="zoomBy(-0.1)" title="text smaller (-)">A&#8722;</button>
    <button onclick="zoomBy(0.1)" title="text bigger (+)">A+</button>
  </span>
</header>
<input type="text" id="search" placeholder="search every tab…  (esc to close)">

<div id="tipbar" onclick="nextTip()" title="click for another (auto-rotates every 15m)">
  <span class="t">tip</span>
  <span id="tiptext">loading…</span>
</div>

<div class="grid" id="grid">

{{CARDS}}
</div>

<!-- tips array, regenerated from docs/tips.txt each time `cheatsheet` opens -->
<script src="cheatsheet-tips.js"></script>
<script>
// ── storage: per-viewer conveniences only; the page works without it ────────
function recall(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function remember(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* private window etc. */ }
}

// ── tips index ──────────────────────────────────────────────────────────────
// Every line of docs/tips.txt (window.TIPS), grouped by its (category) prefix
// and filed under the tab that category belongs to, closed, below the curated
// cards. Categories with no tab ("misc") only show on the "all" tab.
const CAT_TAB = {
  lazygit: 'git', git: 'git', gist: 'git',
  zsh: 'term', tmux: 'term', 'tmux/copy-mode': 'term', yazi: 'term', ssh: 'term',
  mosh: 'term', '1p': 'term', combo: 'term', workflow: 'term', cheatsheet: 'term',
  voice: 'voice', mic: 'voice',
  computah: 'pc',
  desk: 'desk', hue: 'desk', winmode: 'desk', alfred: 'desk', kbd: 'desk', sketchybar: 'desk',
  obsidian: 'make', weeknotes: 'make', pipeline: 'make',
};
const PROSE_CATS = ['reading', 'vibe', 'wisdom'];

function tabForCat(cat) {
  if (cat.startsWith('nvim') || cat.endsWith('.nvim')) return 'nvim';
  if (Object.hasOwn(CAT_TAB, cat)) return CAT_TAB[cat];
  return 'misc';
}
function toneForTab(tab, cat) {
  if (PROSE_CATS.includes(cat)) return 'prose';
  if (tab === 'git') return 'gold';
  if (tab === 'nvim') return '';
  return 'accent';
}
function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function tipRow(line) {
  const i = line.indexOf(' - ');
  if (i === -1) return '<div class="r"><span class="d">' + escHtml(line) + '</span></div>';
  let key = line.slice(0, i);
  let desc = line.slice(i + 3);
  // a key that ends in a literal dash ("space -", "C-a -"): re-glue the dash
  if (desc.startsWith('- ')) { key += ' -'; desc = desc.slice(2); }
  let cls = 'r';
  if (key.length > 16) cls = 'r st';
  return '<div class="' + cls + '"><kbd>' + escHtml(key) + '</kbd><span class="d">' + escHtml(desc) + '</span></div>';
}

(function buildIndex() {
  const tips = (window.TIPS || []).filter(Boolean);
  const grid = document.getElementById('grid');
  if (!tips.length || !grid) return;
  const groups = Object.create(null); // no inherited keys: a "(constructor)" tip is fine
  const cats = [];
  for (const line of tips) {
    const m = line.match(/^\(([^)]+)\)\s*(.*)$/);
    let cat = 'misc';
    let rest = line;
    if (m) { cat = m[1]; rest = m[2]; }
    if (!groups[cat]) { groups[cat] = []; cats.push(cat); }
    groups[cat].push(rest);
  }
  const tabOrder = Array.from(document.querySelectorAll('#tabs button')).map(b => b.dataset.tab);
  const rank = cat => {
    const i = tabOrder.indexOf(tabForCat(cat));
    if (i === -1) return tabOrder.length;
    return i;
  };
  cats.sort((a, b) => (rank(a) - rank(b)) || (groups[b].length - groups[a].length));

  const frag = document.createDocumentFragment();
  const hdr = document.createElement('h2');
  hdr.className = 'g';
  hdr.id = 'ixhdr';
  hdr.innerHTML = 'index <span class="sub">every tip from tips.txt</span>';
  frag.appendChild(hdr);
  for (const cat of cats) {
    const d = document.createElement('details');
    const tab = tabForCat(cat);
    d.dataset.group = tab;
    d.dataset.ix = '1';
    d.className = toneForTab(tab, cat);
    // same rule as `cheat gen`: mostly-command categories stack every row
    const keyed = groups[cat].filter(r => r.indexOf(' - ') > 10).length;
    if (keyed * 2 > groups[cat].length) d.classList.add('stk');
    d.innerHTML = '<summary>' + escHtml(cat) + '<span class="ct">' + groups[cat].length +
      '</span></summary><div class="c">' + groups[cat].map(tipRow).join('') + '</div>';
    frag.appendChild(d);
  }
  grid.appendChild(frag);
})();

// ── tabs ────────────────────────────────────────────────────────────────────
const tabButtons = Array.from(document.querySelectorAll('#tabs button'));
const TABS = tabButtons.map(b => b.dataset.tab);
// opens on the last tab you used; cheatsheet.html#git forces one
let currentTab = recall('cheatTab');
const hashTab = location.hash.slice(1);
if (TABS.includes(hashTab)) currentTab = hashTab;
if (!TABS.includes(currentTab)) currentTab = TABS[0];

function cardOnTab(card, tab) {
  return tab === 'all' || card.dataset.group === tab || card.dataset.live === '1';
}

// Show one tab. Cards return to their resting state: the ones marked
// `open = true` in the TOML open on their own tab; "all" is a closed outline.
function showTab(tab) {
  currentTab = tab;
  remember('cheatTab', tab);
  tabButtons.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  let indexCards = 0;
  document.querySelectorAll('details').forEach(card => {
    const on = cardOnTab(card, tab);
    card.classList.toggle('hidden', !on);
    card.querySelectorAll('.r').forEach(r => r.classList.remove('hidden', 'highlight'));
    if (on && card.dataset.ix === '1') indexCards += 1;
    if (tab === 'all') {
      card.open = card.dataset.live === '1' && card.dataset.open === '1';
    } else {
      card.open = card.dataset.open === '1';
    }
  });
  document.querySelectorAll('h2.g').forEach(h => {
    if (h.id === 'ixhdr') h.classList.toggle('hidden', indexCards === 0);
    else h.classList.toggle('hidden', tab !== 'all');
  });
  window.scrollTo(0, 0);
}
// Picking a tab by hand (click or number key) also drops any search, so the
// box never shows a query the cards no longer reflect.
function goTab(tab) {
  const box = document.getElementById('search');
  box.value = '';
  box.blur();
  box.classList.remove('on');
  showTab(tab);
}
tabButtons.forEach(b => b.addEventListener('click', () => goTab(b.dataset.tab)));

function toggleAll(open) {
  document.querySelectorAll('details:not(.hidden)').forEach(d => { d.open = open; });
}

// ── search: always across every tab ─────────────────────────────────────────
const search = document.getElementById('search');
function openSearch() {
  search.classList.add('on');
  search.focus();
}
search.addEventListener('input', () => {
  const q = search.value.toLowerCase().trim();
  if (!q) { showTab(currentTab); return; }
  document.querySelectorAll('h2.g').forEach(h => h.classList.add('hidden'));
  document.querySelectorAll('details').forEach(card => {
    const titleHit = card.querySelector('summary').textContent.toLowerCase().includes(q);
    let hit = titleHit;
    card.querySelectorAll('.r').forEach(row => {
      const rowHit = row.textContent.toLowerCase().includes(q);
      row.classList.toggle('highlight', rowHit);
      row.classList.toggle('hidden', !rowHit && !titleHit);
      if (rowHit) hit = true;
    });
    card.querySelectorAll('.n, .o, .strat, .lbl').forEach(el => {
      if (el.textContent.toLowerCase().includes(q)) hit = true;
    });
    card.classList.toggle('hidden', !hit);
    card.open = hit;
  });
});
// clicking away with an empty box hides it; with text, it stays for editing
search.addEventListener('blur', () => {
  if (!search.value.trim()) search.classList.remove('on');
});

// ── text zoom: A−/A+ buttons or bare +/- keys (0 = reset) ───────────────────
let cheatZoom = parseFloat(recall('cheatZoom')) || 1;
function applyZoom() { document.body.style.zoom = cheatZoom; }
function zoomBy(d) {
  cheatZoom = Math.round(Math.min(2, Math.max(0.5, cheatZoom + d)) * 100) / 100;
  remember('cheatZoom', cheatZoom);
  applyZoom();
}
applyZoom();

// ── keys: / search · esc clear · 1-9 tabs · + - 0 zoom ──────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const hadQuery = search.value.trim() !== '';
    search.value = '';
    search.blur();
    search.classList.remove('on');
    if (hadQuery) showTab(currentTab);
    return;
  }
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (e.key >= '1' && e.key <= '9') {
    const tab = TABS[parseInt(e.key, 10) - 1];
    if (tab) goTab(tab);
    return;
  }
  if (e.key === '+' || e.key === '=') zoomBy(0.1);
  else if (e.key === '-') zoomBy(-0.1);
  else if (e.key === '0') { cheatZoom = 1; remember('cheatZoom', 1); applyZoom(); }
});

// ── tip of the moment, from docs/tips.txt via cheatsheet-tips.js ────────────
(function () {
  const tips = (window.TIPS || []).filter(Boolean);
  const el = document.getElementById('tiptext');
  if (!el) return;
  if (!tips.length) { el.textContent = 'run `cheatsheet` in a shell to load tips'; return; }
  let i = Math.floor(Math.random() * tips.length);
  const show = () => { el.textContent = tips[i % tips.length]; };
  window.nextTip = () => { i = (i + 1) % tips.length; show(); };
  show();
  setInterval(window.nextTip, 15 * 60 * 1000);
})();

showTab(currentTab);
</script>
</body>
</html>
