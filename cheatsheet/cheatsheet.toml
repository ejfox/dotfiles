[[section]]
tone = "primary"
tool = "nvim"
badge = "nvim"
title = "Folds"
open = true
body = [
  { n = 'folds follow real code structure (treesitter / LSP, not indent guesses). *foldlevel* is a depth dial: *0* = everything shut, *99* = everything open. LazyVim starts at 99, so you close what you want rather than dig out.' },
  { lbl = "this fold — at the cursor" },
  { k = "za", d = "toggle (the everyday key)", hl = true },
  { k = "zo / zc", d = "open / close, just this one" },
  { k = "zA / zO / zC", d = "same, but recursive (nested)" },
  { k = "zK", d = "peek inside without opening (ufo)" },
  { k = "zv", d = "open just enough to see cursor" },
  { lbl = "whole file — slide the level dial" },
  { k = "zM / zR", d = "slam shut / fling open", hl = true },
  { k = "zm / zr", d = "one level tighter / looser" },
  { k = "zi", d = "folding on/off entirely" },
  { lbl = "move between folds" },
  { k = "zj / zk", d = "next / prev fold" },
  { k = "[z / ]z", d = "start / end of current fold" },
  { o = 'mnemonics: **m** = more folding, **r** = reduce it; caps go all the way (**M**ax / **R**eset). z = folded paper.' },
  { strat = "strategy · collapse to navigate", steps = [
    '`zM`  shut everything → read the file as an outline of names',
    '`zj` `zk`  jump to the block, `za` cracks just that one',
    '`zR`  fling it all open again — zoom-out / zoom-in for code',
    '`zm` `zr`  peel structure one layer at a time when all-or-nothing is too blunt',
    '`zK`  glance inside a fold mid-scroll without losing your place',
    'on a *closed* fold, `yy` / `dd` hit every line in it — grab or move a whole block in one keystroke',
  ] },
]

