# ejfox cheatsheet — THE ONE SOURCE OF TRUTH
#
# Edit this file. `cheat` (the TUI) reads it directly; `cheat gen` rebuilds
# ~/.dotfiles/.config/cheatsheet.html (the Hammerspoon floating panel) from it.
# The Hammerspoon panel regenerates on every open, so a save here is enough.
#
# ── inline markup (in n / o / strat steps) ─────────────────────────────
#   `x`   → a key (kbd)          *x*   → emphasis (teal)
#   **x** → bold                 \`    → a literal backtick
#   literal unicode is fine:  →  ⎵ (leader/space)  ⏎ (return)  — (dash)
#
# ── section fields ─────────────────────────────────────────────────────
#   tone  = "accent" | "primary" | "gold" | "prose" | ""   (border/kbd color)
#   tool  = "nvim" | "lazygit" | "both"                     (filter buttons)
#   badge = "nvim" | "lazygit" | ""                         (label in title)
#   open  = true|false                                      (expanded on load)
#
# ── body items (order preserved) ───────────────────────────────────────
#   { k = "za", d = "toggle" }          a binding row
#   { k = "za", d = "toggle", hl = true }   highlighted (teal daily-driver)
#   { div = true }                      a divider line
#   { lbl = "at the cursor" }           sub-group label
#   { n = "prose note" }                narrative line
#   { o = "footnote" }                  ↳ footnote line
#   { strat = "header", steps = [...] } strategy callout

[meta]
title = "ejfox cheatsheet"

