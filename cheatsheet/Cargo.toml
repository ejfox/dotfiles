[package]
name = "cheat"
version = "0.1.0"
edition = "2021"
description = "ejfox cheatsheet — TUI + HTML generator from one TOML source"

[[bin]]
name = "cheat"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = "s"
lto = true
strip = true
